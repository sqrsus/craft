name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER: rust-lld
  CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: -C target-feature=+crt-static

jobs:
  build:
    name: build (windows-x64)
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows-x64
            program: vera20k.exe

    steps:
      - name: Check out with LF line endings
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v7

      - name: Require the tag to match the Cargo.toml version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match Cargo.toml version $version (expected v$version)" >&2
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-about
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-about@0.9.2

      - name: Third-party license notices
        shell: bash
        run: |
          mkdir -p dist
          cargo about generate --locked --fail -c .github/release/about.toml \
            -o dist/THIRD_PARTY_LICENSES.html .github/release/about.hbs

      - uses: Swatinem/rust-cache@v2

      - name: Build the game
        run: cargo build --release --locked --bin vera20k

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME//\//-}"
          name="vera20k-$version-x64"
          mkdir -p "dist/$name"
          cp "target/release/vera20k.exe" config.toml.example LICENSE-GPL \
             dist/THIRD_PARTY_LICENSES.html "dist/$name/"
          sed "s/@VERSION@/$version/" .github/release/README.txt.in > "dist/$name/README.txt"
          cd "dist/$name"
          7z a -tzip "../$name.zip" ./* > /dev/null

      - uses: actions/upload-artifact@v7
        with:
          name: windows-x64
          path: |
            dist/*.zip
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - uses: actions/attest@v4
        with:
          subject-path: dist/vera20k-*

      - name: Create the pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum vera20k-* > SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --prerelease --generate-notes --title "VERA20k $GITHUB_REF_NAME" ./*
