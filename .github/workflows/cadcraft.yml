# =============================================================================
# Build storytold/cadcraft - Windows x64 only (no Linux/macOS matrix)
#
# Pure-Rust CAD app (Cargo workspace, rust 1.90; desktop/web UI builds require
# 1.95+). The default "stable" toolchain satisfies this.
#   main app package: cadcraft -> cadcraft.exe
#   CLI package:      cadcraft-cli
#
# This workflow is fully self-contained and has NO dependency on the photocraft
# build (that lives in its own workflow file). The two workflows share no
# configuration and run independently.
#
# Artifacts: ONLY a Windows MSI installer is produced and uploaded. No EXE /
# PDB / build-log archives are packaged or uploaded. The EXE/CLI are built only
# as intermediate inputs to the MSI.
#
# Toolchain: Rust (MSVC host triple on windows-latest). No Node/npm/pnpm/Electron.
# MSI packaging: WiX Toolset v3 (pinned 3.14.1); the .wxs is GENERATED INLINE so
# the build never depends on a separately committed file being present.
#
# Triggers:
#   - schedule:           every day at 08:30 Asia/Shanghai (UTC+8 => 00:30 UTC)
#   - workflow_dispatch:   manual, with build_msi / clean_cache / rust_toolchain
# =============================================================================

name: Build cadcraft (Windows x64)

on:
  schedule:
    # 08:30 Beijing time (Asia/Shanghai, UTC+8) == 00:30 UTC
    - cron: "30 0 * * *"
  workflow_dispatch:
    inputs:
      build_msi:
        description: "Package a Windows MSI installer with the WiX Toolset"
        type: boolean
        default: true
      clean_cache:
        description: "Do not restore or save the Cargo build cache"
        type: boolean
        default: false
      rust_toolchain:
        description: "Rust toolchain version (desktop needs >= 1.95)"
        type: string
        default: "stable"

# Prevent overlapping runs of this workflow on the same ref.
concurrency:
  group: build-cadcraft-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  # Pulls git dependencies from github.com/storytold/craft-libs; git CLI is more
  # reliable on Windows runners than libgit2.
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

jobs:
  build-cadcraft:
    name: "cadcraft (windows-latest, x64)"
    runs-on: windows-latest
    steps:
      - name: Checkout storytold/cadcraft
        uses: actions/checkout@v4
        with:
          repository: storytold/cadcraft
          ref: main
          path: cadcraft
          # Public repo, no token needed. If it ever becomes private, add:
          # token: ${{ secrets.UPSTREAM_PAT }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ inputs.rust_toolchain }}
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo registry and build
        if: ${{ !inputs.clean_cache }}
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: cadcraft
          key: cadcraft-windows-x64
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build release binaries
        working-directory: cadcraft
        shell: pwsh
        env:
          # Mirrors the reference build step. CARGO_HOME is the runner default but
          # pinned here for parity; CARGO_INCREMENTAL=0 keeps CI builds lean.
          # CACHE_ON_FAILURE has no standard consumer in this flow (leftover from
          # the reference) and is harmless.
          CARGO_HOME: C:\Users\runneradmin\.cargo
          CARGO_INCREMENTAL: "0"
          CACHE_ON_FAILURE: "false"
        run: |
          $ErrorActionPreference = 'Stop'
          # Build the GUI app AND the CLI, with the static CRT so the MSI needs
          # no Visual C++ redistributable. EXE/CLI are intermediate inputs to the
          # MSI and are NOT packaged/uploaded themselves.
          $env:CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS = '-C target-feature=+crt-static'
          cargo build --release --locked -p cadcraft -p cadcraft-cli *>&1 |
            Tee-Object -FilePath build.log
          $code = $LASTEXITCODE
          Write-Host "cargo build exit code: $code"
          if ($code -ne 0) { exit $code }
          if (-not (Test-Path 'target/release/cadcraft.exe')) {
            Write-Error 'cadcraft.exe not found under target/release/'
            exit 1
          }
          if (-not (Test-Path 'target/release/cadcraft-cli.exe')) {
            Write-Error 'cadcraft-cli.exe not found under target/release/'
            exit 1
          }

      - name: Install WiX Toolset v3 (pinned 3.14.1)
        if: ${{ inputs.build_msi }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = "$env:RUNNER_TEMP\wix.zip"
          $wixDir = "$env:RUNNER_TEMP\wix"
          Invoke-WebRequest `
            -Uri "https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip" `
            -OutFile $zip
          New-Item -ItemType Directory -Force -Path $wixDir | Out-Null
          Expand-Archive -Path $zip -DestinationPath $wixDir -Force
          Add-Content -Path $env:GITHUB_PATH -Value $wixDir

      - name: Build MSI installer (WiX)
        if: ${{ inputs.build_msi }}
        shell: pwsh
        env:
          APP_NAME: CADCraft
          EXE_NAME: cadcraft.exe
          CLI_EXE_NAME: cadcraft-cli.exe
          PKG_NAME: cadcraft
          UPGRADE_GUID: "{B2C3D4E5-2222-3333-4444-555566667777}"
        run: |
          $ErrorActionPreference = 'Stop'
          $repo = $env:PKG_NAME
          $releaseDir = Resolve-Path "$repo/target/release"
          # Read the package version from cargo metadata (no build needed).
          $meta = cargo metadata --manifest-path "$repo/Cargo.toml" --no-deps --format-version 1 |
                  ConvertFrom-Json
          $ver = ($meta.packages | Where-Object { $_.name -eq $env:PKG_NAME }).version
          if (-not $ver) { $ver = '0.0.0' }
          # Strip any pre-release / build metadata (e.g. 0.8.2-beta.1 -> 0.8.2).
          $ver = ($ver -split '[-+]')[0]
          $parts = ($ver.Split('.') | Select-Object -First 3)
          while ($parts.Count -lt 3) { $parts += '0' }
          # Numeric 3-part version for the MSI ProductVersion. WiX requires
          # major.minor.build and rejects letters, so this stays numeric.
          $ver = $parts -join '.'
          # DEV marker: distinguish OUR build from the upstream release build.
          # Added to the OUTPUT FILENAME only (e.g. cadcraft-0.8.2-dev-windows-x64.msi);
          # the internal ProductVersion above stays numeric so `light.exe` succeeds.
          $devVer = "$ver-dev"
          # Dev MSI naming: <pkg>-<version>-dev-windows-x64.msi
          $msi = "artifacts/$repo/$env:PKG_NAME-$devVer-windows-x64.msi"
          New-Item -ItemType Directory -Force -Path "artifacts/$repo" | Out-Null
          # Generate the WiX source inline so the build never depends on a
          # separately committed file being present in the checkout.
          # Mirrors the source repo's packaging: the GUI app + the CLI, a Start
          # Menu shortcut, and a per-machine install under Program Files\<AppName>.
          $wxs = "$env:RUNNER_TEMP/installer.wxs"
          $lines = @(
            '<?xml version="1.0" encoding="UTF-8"?>'
            '<Wix xmlns="http://schemas.microsoft.com/wix/2006/wi">'
            '  <Product'
            '      Id="*"'
            '      Name="$(var.ProductName)"'
            '      Language="1033"'
            '      Version="$(var.ProductVersion)"'
            '      Manufacturer="$(var.Manufacturer)"'
            '      UpgradeCode="$(var.UpgradeCode)">'
            '    <Package InstallerVersion="500" Compressed="yes" Platform="x64" />'
            '    <Media Id="1" Cabinet="media1.cab" EmbedCab="yes" />'
            '    <MajorUpgrade AllowSameVersionUpgrades="yes" DowngradeErrorMessage="A newer version of $(var.ProductName) is already installed." />'
            '    <Directory Id="TARGETDIR" Name="SourceDir">'
            '      <Directory Id="ProgramFiles64Folder">'
            '        <Directory Id="INSTALLFOLDER" Name="$(var.ProductName)" />'
            '      </Directory>'
            '      <Directory Id="ProgramMenuFolder">'
            '        <Directory Id="AppMenuDir" Name="$(var.ProductName)" />'
            '      </Directory>'
            '    </Directory>'
            '    <Feature Id="DefaultFeature" Title="$(var.ProductName)" Level="1">'
            '      <ComponentRef Id="MainExecutable" />'
            '      <ComponentRef Id="CliExecutable" />'
            '      <ComponentRef Id="StartMenuShortcut" />'
            '    </Feature>'
            '    <Component Id="MainExecutable" Guid="*" Directory="INSTALLFOLDER">'
            '      <File Id="ExeFile" Source="$(var.SourceDir)\$(var.ExeName)" KeyPath="yes" />'
            '    </Component>'
            '    <Component Id="CliExecutable" Guid="*" Directory="INSTALLFOLDER">'
            '      <File Id="CliFile" Source="$(var.SourceDir)\$(var.CliExeName)" KeyPath="yes" />'
            '    </Component>'
            '    <Component Id="StartMenuShortcut" Guid="*" Directory="AppMenuDir">'
            '      <Shortcut Id="StartMenuShortcut" Name="$(var.ProductName)" Target="[INSTALLFOLDER]$(var.ExeName)" WorkingDirectory="INSTALLFOLDER" />'
            '      <RegistryValue Root="HKCU" Key="Software\$(var.Manufacturer)\$(var.ProductName)" Name="installed" Type="string" Value="1" KeyPath="yes" />'
            '    </Component>'
            '  </Product>'
            '</Wix>'
          )
          $lines -join "`n" | Set-Content -Path $wxs -Encoding UTF8
          # Compile the generated .wxs into a .wixobj, filling preprocessor vars.
          candle.exe -nologo `
            -dProductName="$env:APP_NAME" `
            -dProductVersion="$ver" `
            -dManufacturer="storytold" `
            -dExeName="$env:EXE_NAME" `
            -dCliExeName="$env:CLI_EXE_NAME" `
            -dSourceDir="$releaseDir" `
            -dUpgradeCode="$env:UPGRADE_GUID" `
            -out "$env:RUNNER_TEMP/$repo.wixobj" `
            $wxs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Link into a single embedded-cabinet MSI (-sval skips ICE validation).
          light.exe -nologo -sval `
            "$env:RUNNER_TEMP/$repo.wixobj" `
            -out $msi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host "Produced MSI: $msi"

      - name: Upload MSI artifact (cadcraft-windows-x64)
        if: ${{ inputs.build_msi }}
        uses: actions/upload-artifact@v4
        with:
          name: cadcraft-windows-x64
          # Only the MSI is uploaded; no EXE / PDB / log archives.
          path: artifacts/cadcraft/*.msi
          if-no-files-found: warn
          retention-days: 14

      - name: Print build log tail on failure
        if: ${{ failure() }}
        working-directory: cadcraft
        shell: pwsh
        run: |
          if (Test-Path 'build.log') {
            Write-Host '----- build.log (last 200 lines) -----'
            Get-Content 'build.log' -Tail 200
          }
