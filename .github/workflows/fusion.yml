# =============================================================================
# 独立仓库（craft）中的手动编译工作流：交叉编译 Fusion 到 FreeBSD
# 目标项目：https://github.com/0x2E/fusion （上游，已写死，构建时可覆盖分支）
# 运行平台：serv00.com（FreeBSD amd64）
#
# 为什么需要这个工作流：
#   fusion 自带的 ./scripts.sh release 只产出 linux / darwin / windows 三种产物，
#   而 serv00.com 是 FreeBSD，必须用 GOOS=freebsd 编译。后端使用
#   modernc.org/sqlite（纯 Go 实现），因此 CGO_ENABLED=0 即可，服务器上
#   不需要任何 C 工具链。
#
# 与上一版的差异（上一版报错：
#   Can't find 'action.yml' ... under '.../.github/actions/setup-toolchains'）：
#   1. 根因：craft 仓库里只有工作流，既没有 fusion 源码，也没有 fusion 的复合
#      action .github/actions/setup-toolchains/action.yml。上一版写了
#      uses: ./.github/actions/setup-toolchains —— 本地 action 是从当前仓库
#      工作区解析的，而 checkout 签出的是 craft 自己，因此必然找不到。
#      这不是“漏了 checkout”（checkout 本来就在第一步），而是“补了 checkout
#      也没用”，因为那个目录根本不在 craft 里。
#   2. 现在改为 openra.yml 同款模式：actions/checkout 用 repository / ref /
#      path 参数把 fusion 源码拉到 fusion/ 子目录，工具链全部在本文件内联安装
#      （setup-go / pnpm / setup-node），不再引用任何本地复合 action。
#   3. 构建入口仍复用 fusion 自带的 scripts.sh，不重写 pnpm / go 命令，
#      上游改构建参数时本工作流自动跟随。
#   4. 源码仓库写死为上游 0x2E/fusion（见 env.SRC_REPO），不再作为入参暴露，
#      避免每次运行都要填写、也避免误填成别的仓库/分支组合。只保留
#      source_ref 一个可调项（分支 / 标签 / 提交 SHA）。若需要临时改仓库，
#      直接改 env.SRC_REPO 一行即可。
#
# 兼容性：Go 对 freebsd/amd64、freebsd/arm64 的最低目标为 FreeBSD 13.0，
#   上机后用 uname -r 确认。
#
# 关于产物体积（容易被误判）：
#   上游 v1.3.0 的 fusion-linux-amd64 裸二进制为 39.36 MB，而
#   fusion_linux_amd64.zip 只有 20.39 MB。所以「40 MB 裸二进制」是正常值，
#   与「20 多兆」的差别只是有没有 zip 压缩，不是构建出错。
#   本工作流默认额外做一次剥符号（等价 -ldflags="-s -w"），通常再降 25%~35%；
#   想与上游产物逐字节对齐时，把 strip 选成 false。
#
# 使用方式：
#   1. Actions 页选择本工作流 -> Run workflow（或 gh workflow run fusion.yml）。
#   2. 产物：该次 run 的 fusion-freebsd artifact，扁平结构 =
#      fusion-freebsd-<arch>（裸二进制，可直接 scp）+ checksums-freebsd.txt。
#      本工作流只负责「编出产物」，不创建 Release、不上传任何资产。
#   3. 部署：scp fusion-freebsd-amd64 LOGIN@HOST:/usr/home/LOGIN/fusion/fusion
# =============================================================================
name: Build Fusion (FreeBSD)

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "要编译的分支 / 标签 / 提交 SHA（仓库已固定为 0x2E/fusion）"
        required: true
        default: "main"
      arches:
        # 用 choice 而不是自由文本：填错成 "freebsd" 会拼出
        # GOOS=freebsd GOARCH=freebsd，go build 直接报
        # "unsupported GOOS/GOARCH pair"。
        # TARGET_OS 已硬编码为 freebsd，这里只需给架构。
        description: "目标架构（只填架构，不要填 freebsd；serv00 为 amd64）"
        required: true
        type: choice
        default: "amd64"
        options:
          - "amd64"
          - "amd64 arm64"
          - "arm64"
      strip:
        # 体积优化开关，默认开。剥离符号表与 DWARF，通常 -25%~-35%，
        # 不影响运行（panic 堆栈仍带函数名与行号），也不影响 go version -m。
        description: "剥离符号表与调试信息以减小体积（不影响运行）"
        required: true
        type: choice
        default: "true"
        options:
          - "true"
          - "false"

permissions:
  contents: read

# 同一 ref 同时只跑一个任务；中途取消会留下不完整的产物
concurrency:
  group: build-fusion-${{ github.ref }}
  cancel-in-progress: false

env:
  # 源码检出到工作区的子目录，避免与 craft 自身的工作流文件同目录混淆
  SOURCE_PATH: fusion
  TARGET_OS: freebsd
  # 源码仓库写死为上游；要临时构建别的仓库只改这一行。
  # 注意：仓库若为私有，craft 的 GITHUB_TOKEN 读不到，需要 PAT。
  SRC_REPO: 0x2E/fusion
  SRC_REF: ${{ inputs.source_ref || 'main' }}
  TARGET_ARCHES: ${{ inputs.arches || 'amd64' }}
  STRIP: ${{ inputs.strip || 'true' }}

jobs:
  build:
    name: Cross-compile Fusion for FreeBSD
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        # scripts.sh 以 $(pwd) 作为仓库根来解析相对输出路径，且 build-backend
        # 要求 backend/internal/web/dist/index.html 已存在，所以所有命令都
        # 必须在 fusion/ 目录下执行。
        working-directory: fusion
    steps:
      # ---------- 1. 源码获取：拉取外部仓库 fusion 到子目录 ----------
      - name: "1. 检出 fusion 源码（外部仓库，拉到 fusion/ 子目录）"
        uses: actions/checkout@v7
        with:
          repository: ${{ env.SRC_REPO }}
          ref: ${{ env.SRC_REF }}
          path: ${{ env.SOURCE_PATH }}
          fetch-depth: 1

      # ---------- 2. 工具链：Go（版本从 go.mod 读，不硬编码） ----------
      - name: "2. 安装 Go（版本取自 fusion/backend/go.mod）"
        uses: actions/setup-go@v6
        with:
          go-version-file: fusion/backend/go.mod
          cache-dependency-path: fusion/backend/go.sum

      # ---------- 3. 工具链：pnpm ----------
      # frontend/package.json 里没有 packageManager 字段，corepack 无法自动定
      # 版本，必须显式给 version。
      - name: "3. 安装 pnpm 10"
        uses: pnpm/action-setup@v4
        with:
          version: "10"

      # ---------- 4. 工具链：Node ----------
      # frontend/package.json 的 engines.node 为 ">=24"，且 requirements 需在
      # setup-node 之前装好 pnpm 才能用 cache: pnpm。
      - name: "4. 安装 Node 24"
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: fusion/frontend/pnpm-lock.yaml

      # ---------- 5. 前置校验：架构入参 + 源码目录结构 ----------
      # 上一版失败模式（找不到 action.yml / 路径不对），以及
      # GOOS/GOARCH 填错（把 freebsd 填进 arches），都应在这里以明确的
      # 报错暴露，而不是等到 go build 才抛 "unsupported GOOS/GOARCH pair"。
      - name: "5. 校验入参（架构白名单）与源码目录结构"
        # run 脚本保持纯 ASCII（与 openra.yml 的编码纪律一致），
        # 中文只出现在注释与步骤名里。
        # 5.1 架构只允许 amd64 / arm64：TARGET_OS 已由 env 固定为 freebsd，
        #     不需要也不允许通过 arches 传入。
        # 5.2 源码树完整性：checkout 的 repository/ref/path 不对时在此明确报错。
        run: |
          set -euo pipefail

          for arch in $TARGET_ARCHES; do
            case "$arch" in
              amd64|arm64) ;;
              *)
                echo "FAIL: invalid arch '$arch' (TARGET_ARCHES='$TARGET_ARCHES')"
                echo "GOOS is already fixed to '${TARGET_OS}' by env.TARGET_OS."
                echo "The 'arches' input must list CPU architectures only: amd64 or arm64."
                exit 1
                ;;
            esac
          done
          echo "target os/arch: ${TARGET_OS} / ${TARGET_ARCHES}"

          for f in scripts.sh LICENSE README.md \
                   backend/go.mod backend/go.sum backend/cmd/fusion/main.go \
                   frontend/package.json frontend/pnpm-lock.yaml; do
            if [ ! -f "$f" ]; then
              echo "FAIL: $f not found under $(pwd)"
              echo "The checkout step did not fetch the fusion source tree;"
              echo "check env.SRC_REPO / env.SRC_REF and the checkout 'path' input."
              exit 1
            fi
          done
          echo "source tree OK at $(pwd)"
          head -1 backend/go.mod

      # ---------- 6. 环境报告 ----------
      - name: "6. 报告工具链版本"
        run: |
          set -euo pipefail
          go version
          go env GOOS GOARCH CGO_ENABLED
          node --version
          pnpm --version
          git rev-parse --short HEAD

      # ---------- 7. 前端构建（后端 embed 依赖它，顺序不可调换） ----------
      - name: "7. 构建前端并同步到 embed 目录"
        # scripts.sh build-frontend = pnpm install --frozen-lockfile + run build
        # + 把 frontend/dist 复制到 backend/internal/web/dist（go:embed 目标）。
        # 少了这一步，build-backend 会直接 exit 1。
        run: ./scripts.sh build-frontend

      # ---------- 8. 后端交叉编译 ----------
      - name: "8. 交叉编译 FreeBSD 二进制"
        run: |
          set -euo pipefail
          mkdir -p dist
          for arch in $TARGET_ARCHES; do
            ./scripts.sh build-backend "$TARGET_OS" "$arch" "./dist/fusion-$TARGET_OS-$arch"
          done
          ls -lh dist

      # ---------- 9. 体积优化：剥离符号表与 DWARF（可选，默认开） ----------
      # 先摆事实：上游 v1.3.0 的 fusion-linux-amd64 裸二进制为 39.36 MB，
      # 而 fusion_linux_amd64.zip 只有 20.39 MB —— 差距全部来自 zip 压缩。
      # 也就是说「40 MB 裸二进制」与上游一致，不是本工作流编错了。
      # 上游 release.yml 也没做 strip（scripts.sh 只带 -trimpath 和
      # -extldflags "-static"），所以官方产物同样未剥符号。
      #
      # 真正能减体积的是链接期剥符号，等价于 -ldflags="-s -w"：
      #   -s 去掉符号表（.symtab/.strtab），-w 去掉 DWARF 调试信息
      # 不影响运行：panic 堆栈靠 .gopclntab 还原函数名与行号，不会被剥掉；
      # go version -m 读的是 .go.buildinfo 数据段，同样保留（下一条步骤会验证）。
      # 不采用 UPX：会破坏 buildinfo 与 ELF 校验，且 FreeBSD 支持不确定。
      - name: "9. 剥离符号表与调试信息"
        # run 脚本保持纯 ASCII。GNU strip 是宿主机架构的（arm64 会失败），
        # llvm-strip 与目标架构无关，优先找它，通常装在 /usr/lib/llvm-*/bin 下。
        if: env.STRIP == 'true'
        run: |
          set -euo pipefail

          find_strip() {
            if command -v llvm-strip >/dev/null 2>&1; then
              command -v llvm-strip
              return 0
            fi
            for c in /usr/lib/llvm-*/bin/llvm-strip; do
              if [ -x "$c" ]; then
                printf '%s\n' "$c"
                return 0
              fi
            done
            printf '%s\n' ""
          }

          STRIP_BIN="$(find_strip)"
          if [ -z "$STRIP_BIN" ] && command -v strip >/dev/null 2>&1; then
            STRIP_BIN="strip"
            echo "note: llvm-strip not found, falling back to GNU strip (amd64 only)"
          fi
          if [ -z "$STRIP_BIN" ]; then
            echo "::warning::no strip tool found, keeping unstripped binaries"
            exit 0
          fi

          for arch in $TARGET_ARCHES; do
            bin="dist/fusion-$TARGET_OS-$arch"
            if [ "$STRIP_BIN" = "strip" ] && [ "$arch" != "amd64" ]; then
              echo "::warning::GNU strip cannot strip $arch, keeping $bin unstripped"
              continue
            fi
            before=$(stat -c%s "$bin")
            "$STRIP_BIN" --strip-all "$bin"
            after=$(stat -c%s "$bin")
            echo "$bin: $before -> $after bytes ($(( (before - after) * 100 / before ))% smaller)"
          done

      # ---------- 10. 产物核对：读 ELF 头，不信任构建日志 ----------
      # Go 二进制目标平台错了照样能编译成功，所以必须断言二进制本身：
      #   偏移 7  EI_OSABI  = 9   （FreeBSD；Linux 为 0，macOS 为 2）
      #   偏移 18 e_machine = 62  （x86-64）/ 183（AArch64）
      # 再用 go version -m 交叉核对 GOOS / GOARCH / CGO_ENABLED。
      # 这一步同时兜住上一步的 strip：如果剥得太狠导致 buildinfo 丢失，
      # go version -m 会报错，构建随即失败。
      - name: "10. 断言产物确为 FreeBSD 静态二进制"
        run: |
          set -euo pipefail
          for arch in $TARGET_ARCHES; do
            bin="dist/fusion-$TARGET_OS-$arch"
            test -f "$bin" || { echo "FAIL: $bin missing"; exit 1; }

            osabi=$(od -An -tu1 -j7 -N1 "$bin" | tr -d ' \n')
            machine=$(od -An -tu2 -j18 -N2 "$bin" | tr -d ' \n')
            case "$arch" in
              amd64) want_machine=62 ;;
              arm64) want_machine=183 ;;
              *) echo "FAIL: unknown arch $arch"; exit 1 ;;
            esac

            [ "$osabi" = "9" ] || \
              { echo "FAIL: $bin EI_OSABI=$osabi, want 9 (FreeBSD)"; exit 1; }
            [ "$machine" = "$want_machine" ] || \
              { echo "FAIL: $bin e_machine=$machine, want $want_machine"; exit 1; }

            go version -m "$bin" | grep -Eq "GOOS=$TARGET_OS\b" || \
              { echo "FAIL: $bin GOOS mismatch"; exit 1; }
            go version -m "$bin" | grep -Eq "GOARCH=$arch\b" || \
              { echo "FAIL: $bin GOARCH mismatch"; exit 1; }
            go version -m "$bin" | grep -Eq "CGO_ENABLED=0" || \
              { echo "FAIL: $bin is not built with CGO_ENABLED=0"; exit 1; }

            echo "OK  $bin  OSABI=FreeBSD(9)  e_machine=$machine  CGO_ENABLED=0"
          done

      # ---------- 11. 生成校验和 ----------
      # 本工作流只输出产物本身：一个裸二进制 + 一份 sha256。
      # 不生成 zip、不打 Release、不上传任何资产 —— 需要分发时从 artifact 下载。
      - name: "11. 生成校验和"
        run: |
          set -euo pipefail
          cd dist
          sha256sum fusion-$TARGET_OS-* > checksums-freebsd.txt
          cat checksums-freebsd.txt
          echo
          ls -l

      # ---------- 12. 摘要 ----------
      - name: "12. 写入 Job Summary"
        run: |
          set -euo pipefail
          {
            echo "### Fusion / FreeBSD artifacts"
            echo
            echo "source: \`$SRC_REPO@$SRC_REF\`"
            echo
            echo "| file | size |"
            echo "|---|---|"
            for arch in $TARGET_ARCHES; do
              bin="dist/fusion-$TARGET_OS-$arch"
              size=$(du -h "$bin" | cut -f1)
              echo "| fusion-$TARGET_OS-$arch | $size |"
            done
            echo
            echo "Deploy amd64 to serv00.com:"
            echo
            echo '```'
            echo "scp dist/fusion-freebsd-amd64 LOGIN@HOST:/usr/home/LOGIN/fusion/fusion"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # ---------- 13. 产物上传 ----------
      - name: "13. 上传构建产物"
        # uses 步骤的 path 相对工作区根目录，不受 defaults.run 的 working-directory
        # 影响，所以要带 fusion/ 前缀。两个路径的公共父目录是 fusion/dist，
        # 因此 artifact 内是扁平结构：二进制 + 校验和，没有目录层级。
        uses: actions/upload-artifact@v7
        with:
          name: fusion-freebsd
          path: |
            fusion/dist/fusion-freebsd-*
            fusion/dist/checksums-freebsd.txt
          if-no-files-found: error
          retention-days: 90
