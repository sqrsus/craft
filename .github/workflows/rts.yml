# ConcordRTS — automated Windows x64 release build (clang-cl + Ninja)
#
# This workflow is self-contained: it fetches the upstream source tree at run
# time and builds it here. The repository that hosts it only needs this one
# file — no local clone, no 1888-file upload, no upstream history.
#
# Source is cloned into $GITHUB_WORKSPACE\source, so the hosting repository's
# own contents are irrelevant to the build. Point SOURCE_REPOSITORY / SOURCE_REF
# at a fork or a tag when needed (see the workflow_dispatch inputs).
#
# Documented toolchain contract (README "编译"):
#   Windows x64, Windows PowerShell 5.1, LLVM (clang-cl/lld-link/llvm-lib/llvm-readobj),
#   CMake >= 3.20, Ninja, MSVC x64+x86 headers/libs, x64 CRT redistributables, Windows SDK.
#   Validated combination: LLVM 22.1.3, CMake 4.3.x, Ninja 1.13.2,
#   MSVC 14.51.36231, ABI compat 19.51.36257, Windows SDK 10.0.26100.0.
#
# Nothing in this file requires a Visual Studio "developer prompt": the project
# toolchain resolves every system include/library path explicitly, and the build
# entry point refuses to run when CL/_CL_/LINK/_LINK_ are set in the environment.

name: Build (Windows x64 / clang-cl)

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - '**.md'
      - 'LICENSE'
  pull_request:
  workflow_dispatch:
    inputs:
      source_repository:
        description: 'Upstream repository to build (owner/name)'
        required: false
        default: 'AdrianLuo-X/ConcordRTS'
      source_ref:
        description: 'Branch, tag or full 40-character commit SHA'
        required: false
        default: 'main'
      llvm_version:
        description: 'LLVM version to provision (or "image" to use the runner LLVM)'
        required: false
        default: '22.1.3'
      run_tests:
        description: 'Run the asset-free windows-minimal test profile after building'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    # -NoProfile keeps startup independent of any profile the image may ship;
    # the explicit Bypass matches how the project's own scripts are invoked.
    shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"

env:
  # Pinned to the project's validated release. Override with a repository variable
  # or a manual dispatch input; use "image" to fall back to the runner's LLVM.
  CONCORD_LLVM_VERSION: ${{ inputs.llvm_version || vars.CONCORD_LLVM_VERSION || '22.1.3' }}
  # Where the source comes from. A fork can be built by overriding these without
  # editing the file (workflow_dispatch inputs or repository variables).
  SOURCE_REPOSITORY: ${{ inputs.source_repository || vars.CONCORD_SOURCE_REPOSITORY || 'AdrianLuo-X/ConcordRTS' }}
  SOURCE_REF: ${{ inputs.source_ref || vars.CONCORD_SOURCE_REF || 'main' }}
  CONFIGURATION: Release
  # PROJECT_ROOT and BUILD_DIR are derived by the "Validate project layout" step:
  # no path in this workflow relies on the runner's current directory.

jobs:
  build:
    name: Build + package
    runs-on: windows-2022
    timeout-minutes: 120
    outputs:
      source_commit: ${{ steps.fetch.outputs.commit }}
    steps:
      - name: Fetch upstream source
        id: fetch
        # The hosting repository holds only this workflow, so nothing is checked
        # out from it. The upstream tree is cloned into $GITHUB_WORKSPACE\source
        # and the resolved commit is exported for provenance.
        env:
          # Optional: only needed for a private fork. A public source needs no
          # credential at all, so the anonymous URL is used by default.
          SOURCE_TOKEN: ${{ secrets.CONCORD_SOURCE_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Get-Command git -ErrorAction SilentlyContinue)) { throw 'git is not available on PATH.' }

          $repo = $env:SOURCE_REPOSITORY
          $ref = $env:SOURCE_REF
          if ($repo -notmatch '^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$') {
            throw "SOURCE_REPOSITORY must look like owner/name, got '$repo'."
          }
          $ref = $ref -replace '^refs/(heads|tags)/', ''
          if ([string]::IsNullOrWhiteSpace($ref)) { $ref = 'main' }

          $workspace = $env:GITHUB_WORKSPACE
          New-Item -ItemType Directory -Force -Path $workspace | Out-Null
          $dest = Join-Path $workspace 'source'
          if (Test-Path -LiteralPath $dest) { Remove-Item -LiteralPath $dest -Recurse -Force }

          # Never let git block on an interactive credential prompt.
          $env:GIT_TERMINAL_PROMPT = '0'

          $anonUrl = "https://github.com/$repo.git"
          $cloneUrl = $anonUrl
          if (-not [string]::IsNullOrWhiteSpace($env:SOURCE_TOKEN)) {
            $cloneUrl = "https://x-access-token:$($env:SOURCE_TOKEN)@github.com/$repo.git"
            Write-Host "Using CONCORD_SOURCE_TOKEN to read $repo."
          }

          # A stalled transfer must fail in about a minute instead of holding the
          # step open: abort once throughput drops below 1 KB/s for 60 seconds.
          # Two attempts cover the usual transient runner-side network blip.
          $lastError = ''
          for ($attempt = 1; $attempt -le 2; $attempt++) {
            if (Test-Path -LiteralPath $dest) { Remove-Item -LiteralPath $dest -Recurse -Force }

            if ($ref -match '^[0-9a-fA-F]{40}$') {
              Write-Host "Fetching commit $ref from $repo (attempt $attempt)"
              git init --quiet $dest
              if ($LASTEXITCODE -ne 0) { throw 'git init failed.' }
              git -C $dest remote add origin $cloneUrl
              git -C $dest -c protocol.version=2 -c http.lowSpeedLimit=1000 -c http.lowSpeedTime=60 fetch --depth 1 --quiet origin $ref
              $lastError = "git fetch failed for $repo@$ref (unreachable commit, or private without CONCORD_SOURCE_TOKEN?)."
              if ($LASTEXITCODE -eq 0) {
                git -C $dest checkout --quiet FETCH_HEAD
                $lastError = 'git checkout of the fetched commit failed.'
                if ($LASTEXITCODE -eq 0) { break }
              }
            } else {
              Write-Host "Cloning $repo at $ref (attempt $attempt, depth 1)"
              git -c protocol.version=2 -c http.lowSpeedLimit=1000 -c http.lowSpeedTime=60 clone --depth 1 --single-branch --no-tags --branch $ref --quiet $cloneUrl $dest
              $lastError = "git clone failed for $repo@$ref (bad ref, or private without CONCORD_SOURCE_TOKEN?)."
              if ($LASTEXITCODE -eq 0) { break }
            }

            if ($attempt -lt 2) {
              Write-Warning "$lastError Retrying in 5 seconds."
              Start-Sleep -Seconds 5
            }
          }
          if ($LASTEXITCODE -ne 0) { throw $lastError }

          # --- Tree completeness -------------------------------------------------
          # A depth-1 clone is enough to compile, but it must still carry every
          # blob of HEAD. Two independent shortfalls are checked here, because
          # both have produced confusing downstream failures:
          #   1. a path in the Git index that is absent from the working tree
          #      (a truncated checkout);
          #   2. a blob named by the index that is absent from the object
          #      database (partial or damaged pack). This is what makes the
          #      project's own Check-SourceRepository.ps1 abort with
          #      "<sha> missing", since it reads blob sizes via cat-file.
          # A shortfall triggers one full-history re-clone; if the tree is still
          # short afterwards the step stops instead of handing a half source
          # tree to the compiler.
          function Get-TreeDefects([string]$Path) {
            $defects = New-Object 'System.Collections.Generic.List[string]'
            # Only the ASCII prefix of each index entry is parsed. Git quotes
            # paths that contain non-ASCII bytes ("\345\220\257\345\212\250.cmd"),
            # so the path field cannot be compared with the file system here.
            $entries = @(& git -C $Path ls-files --stage)
            if ($LASTEXITCODE -ne 0 -or $entries.Count -eq 0) {
              $defects.Add('the Git index could not be read')
              return ,$defects
            }
            $blobs = New-Object 'System.Collections.Generic.HashSet[string]'
            foreach ($entry in $entries) {
              $tab = $entry.IndexOf("`t")
              if ($tab -lt 0) { continue }
              $fields = $entry.Substring(0, $tab) -split ' '
              if ($fields.Length -lt 3 -or $fields[0] -eq '160000') { continue }  # gitlink = submodule
              [void]$blobs.Add($fields[1])
            }
            # A filtered (promisor) clone keeps blobs out of the object database
            # and fetches them on demand; any probe that fails to trigger a lazy
            # fetch then reports "<sha> missing". Reject it outright.
            $promisor = (& git -C $Path config --get remote.origin.promisor) -join ''
            if ($promisor.Trim() -eq 'true') {
              $defects.Add('the clone is filtered (promisor remote), so blob metadata is not available locally')
              return ,$defects
            }
            # Tracked files absent from the working tree are detected by git
            # itself, which keeps path decoding out of this script.
            $deleted = @(& git -C $Path diff-files --name-only --diff-filter=D)
            if ($LASTEXITCODE -ne 0) {
              $defects.Add('the working tree could not be compared with the index')
            } elseif ($deleted.Count -gt 0) {
              $defects.Add("$($deleted.Count) tracked file(s) are absent from the working tree")
            }
            $present = New-Object 'System.Collections.Generic.HashSet[string]'
            $allObjects = @(& git -C $Path cat-file --batch-all-objects --batch-check='%(objectname)')
            if ($LASTEXITCODE -ne 0) {
              $defects.Add('the object database could not be enumerated')
              return ,$defects
            }
            foreach ($line in $allObjects) {
              if ($line) { [void]$present.Add($line.Trim()) }
            }
            $missingBlobs = @($blobs | Where-Object { -not $present.Contains($_) })
            if ($missingBlobs.Count -gt 0) {
              $defects.Add("$($missingBlobs.Count) indexed blob(s) are missing from the object database (e.g. $(($missingBlobs | Select-Object -First 3) -join ', '))")
            }
            return ,$defects
          }

          $defects = Get-TreeDefects $dest
          if ($defects.Count -gt 0) {
            Write-Warning ('Depth-1 clone is incomplete: ' + ($defects -join '; '))
            Write-Host 'Re-cloning with full history to repair the tree.'
            if (Test-Path -LiteralPath $dest) { Remove-Item -LiteralPath $dest -Recurse -Force }
            if ($ref -match '^[0-9a-fA-F]{40}$') {
              git init --quiet $dest
              git -C $dest remote add origin $cloneUrl
              git -C $dest -c protocol.version=2 -c http.lowSpeedLimit=1000 -c http.lowSpeedTime=60 fetch --quiet origin $ref
              if ($LASTEXITCODE -eq 0) { git -C $dest checkout --quiet FETCH_HEAD }
            } else {
              git -c protocol.version=2 -c http.lowSpeedLimit=1000 -c http.lowSpeedTime=60 clone --single-branch --no-tags --branch $ref --quiet $cloneUrl $dest
            }
            if ($LASTEXITCODE -ne 0) { throw 'Full-history re-clone failed; the source tree could not be repaired.' }
            $defects = Get-TreeDefects $dest
            if ($defects.Count -gt 0) {
              throw ('Source tree is still incomplete after a full re-clone: ' + ($defects -join '; '))
            }
          }
          $fileCount = @(git -C $dest ls-files).Count
          Write-Host "Source tree verified: $fileCount indexed files, object database complete."

          # Drop the credential from the recorded remote so later steps cannot leak it.
          git -C $dest remote set-url origin $anonUrl

          $commit = (git -C $dest rev-parse HEAD)
          if ($LASTEXITCODE -ne 0 -or -not $commit) { throw 'Could not resolve the source commit.' }
          $commit = $commit.Trim()
          Write-Host "SOURCE_COMMIT = $commit"
          $utf8 = New-Object System.Text.UTF8Encoding($false)
          [IO.File]::AppendAllText($env:GITHUB_ENV, "SOURCE_COMMIT=$commit`n", $utf8)
          [IO.File]::AppendAllText($env:GITHUB_OUTPUT, "commit=$commit`n", $utf8)
          [IO.File]::AppendAllText($env:GITHUB_STEP_SUMMARY, "Source: ``$repo`` @ ``$ref`` ($commit), $fileCount files verified`n")

      - name: Validate project layout
        # Resolves PROJECT_ROOT and BUILD_DIR before any tool is downloaded, and
        # fails with a readable report. A clone that silently produced a partial
        # tree (wrong ref, missing files) or a tree parked in a subdirectory would
        # otherwise surface much later as a cryptic "-File ... does not exist".
        #
        # The happy path costs three [IO.File]::Exists calls. Every phase prints
        # a wall-clock trace (so a stall reports where it stopped instead of an
        # empty log) and all directory scans are capped.
        timeout-minutes: 10
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $ErrorActionPreference = 'Stop'

          $clock = [Diagnostics.Stopwatch]::StartNew()
          function Trace([string]$Message) {
            Write-Host ('[{0,6:N1}s] {1}' -f $clock.Elapsed.TotalSeconds, $Message)
          }

          function Set-JobEnv([string]$Name, [string]$Value) {
            if ([string]::IsNullOrWhiteSpace($Value)) { throw "Empty value for $Name" }
            $utf8 = New-Object System.Text.UTF8Encoding($false)
            [IO.File]::AppendAllText($env:GITHUB_ENV, "$Name=$Value`n", $utf8)
            Write-Host "$Name = $Value"
          }

          Trace 'start'
          $workspace = $env:GITHUB_WORKSPACE
          if ([string]::IsNullOrWhiteSpace($workspace)) { throw 'GITHUB_WORKSPACE is not set.' }
          if (-not [IO.Directory]::Exists($workspace)) { throw "GITHUB_WORKSPACE does not exist: $workspace" }
          Trace "workspace = $workspace"
          Trace "current location = $(Get-Location)"

          $markers = @('CMakeLists.txt', 'cmake\GameTargets.cmake', 'tools\Build-Game.ps1')
          function Test-ProjectRoot([string]$Path) {
            foreach ($marker in $markers) {
              if (-not [IO.File]::Exists((Join-Path $Path $marker))) { return $false }
            }
            return $true
          }

          # Workspace root first, then its direct, non-hidden children. Capped so
          # a pathological checkout cannot turn this probe into a long scan.
          $candidates = New-Object 'System.Collections.Generic.List[string]'
          $candidates.Add($workspace)
          $scanned = 0
          $cap = 40
          foreach ($dir in [IO.Directory]::EnumerateDirectories($workspace)) {
            if ([IO.Path]::GetFileName($dir).StartsWith('.')) { continue }
            if ($scanned -ge $cap) { Trace "directory scan capped at $cap entries"; break }
            $candidates.Add($dir)
            $scanned++
          }
          Trace "candidates to probe: $($candidates.Count)"

          $projectRoot = $null
          foreach ($candidate in $candidates) {
            if (Test-ProjectRoot $candidate) { $projectRoot = $candidate; break }
          }
          if (-not $projectRoot) {
            Trace 'no source tree matched'
            Write-Host ''
            Write-Host "Top-level entries of $workspace (at most 40):"
            $shown = 0
            foreach ($entry in [IO.Directory]::EnumerateFileSystemEntries($workspace)) {
              if ($shown -ge 40) { Write-Host '  ...'; break }
              $kind = if ([IO.Directory]::Exists($entry)) { '[dir] ' } else { '[file]' }
              Write-Host ('  {0} {1}' -f $kind, [IO.Path]::GetFileName($entry))
              $shown++
            }
            Write-Host ''
            Write-Host 'Required project markers that were not found anywhere scanned:'
            foreach ($marker in $markers) { Write-Host "  - $marker" }
            $detail = "Source tree not found. Expected $($markers -join ', ') at $workspace " +
                      'or in one of its immediate subdirectories. ' +
                      'The checked-out commit does not contain a complete ConcordRTS source snapshot; ' +
                      'commit the whole tree (CMakeLists.txt, cmake/, tools/, src/) instead of a partial copy.'
            throw $detail
          }
          Trace "project root = $projectRoot"

          $required = @(
            'CMakeLists.txt',
            'cmake\GameTargets.cmake',
            'cmake\VideoBridge.cmake',
            'cmake\CompilerContract.cmake',
            'tools\Build-Game.ps1',
            'tools\toolchain\Build-WindowsClang.ps1',
            'tools\toolchain\ClangBuildSupport.ps1',
            'tools\toolchain\Configure-WindowsClang.ps1'
          )
          $optional = @(
            'tools\Check-SourceRepository.ps1',
            'tools\testing\Run-LocalTests.ps1'
          )

          $missing = @()
          foreach ($rel in $required) {
            if (-not [IO.File]::Exists((Join-Path $projectRoot $rel))) { $missing += $rel }
          }
          if ($missing.Count) {
            $detail = 'Source snapshot is incomplete. Missing: ' + ($missing -join ', ') +
                      '. The build entry points are part of the project, not of this workflow.'
            throw $detail
          }
          foreach ($rel in $optional) {
            if (-not [IO.File]::Exists((Join-Path $projectRoot $rel))) {
              Write-Warning "Optional project script absent from this snapshot: $rel"
            }
          }

          $buildDir = Join-Path $projectRoot 'build\clang-cl-x64-release'
          Set-JobEnv 'PROJECT_ROOT' $projectRoot
          Set-JobEnv 'BUILD_DIR' $buildDir
          [IO.File]::AppendAllText($env:GITHUB_STEP_SUMMARY, "Project root: ``$projectRoot`` (validated)`n")
          Trace 'done'

      - name: Source repository guard
        # Project-owned hygiene check: it rejects tracked game assets, build
        # outputs and indexed/working blobs over 100 MiB. The signal is useful,
        # but two properties make it unsuitable as a build gate here:
        #   - it inspects upstream content, which this workflow cannot change;
        #   - it reads blob sizes through `git cat-file`, so it aborts with
        #     "<sha> missing" whenever the object database cannot serve that
        #     probe, which has nothing to do with compilation.
        # Findings are therefore reported as warnings plus a dump of the Git
        # state that explains them, and the step always exits 0. The native exit
        # code has to be cleared explicitly: otherwise the failing child
        # process becomes this step's verdict even though nothing threw.
        run: |
          $ErrorActionPreference = 'Stop'
          $guard = Join-Path $env:PROJECT_ROOT 'tools\Check-SourceRepository.ps1'
          if (-not (Test-Path -LiteralPath $guard -PathType Leaf)) {
            Write-Warning 'tools\Check-SourceRepository.ps1 is not present in this snapshot; skipping the repository hygiene guard.'
            exit 0
          }
          if (-not (Test-Path -LiteralPath (Join-Path $env:PROJECT_ROOT '.git'))) {
            Write-Warning 'Source tree has no Git index (not a clone); skipping the repository hygiene guard.'
            exit 0
          }

          & powershell -NoProfile -ExecutionPolicy Bypass -File $guard -ProjectRoot $env:PROJECT_ROOT -TrackedOnly
          $guardExit = $LASTEXITCODE
          $LASTEXITCODE = 0
          if ($guardExit -eq 0) {
            Write-Host 'Repository hygiene guard passed.'
            exit 0
          }

          Write-Warning "Repository hygiene guard reported issues (exit $guardExit). This concerns upstream content that the build cannot fix, so it is advisory and compilation continues."
          Write-Host ''
          Write-Host 'Git state behind that report:'
          $ErrorActionPreference = 'Continue'   # the probes below are expected to fail
          $src = $env:PROJECT_ROOT
          Write-Host ('  HEAD               : ' + (& git -C $src rev-parse HEAD))
          Write-Host ('  shallow clone      : ' + (& git -C $src rev-parse --is-shallow-repository))
          Write-Host ('  promisor remote    : ' + ((& git -C $src config --get remote.origin.promisor) -join ''))
          Write-Host ('  partial clone      : ' + ((& git -C $src config --get remote.origin.partialclonefilter) -join ''))
          $entries = @(& git -C $src ls-files --stage)
          Write-Host ('  index entries      : ' + $entries.Count)
          $objects = @(& git -C $src cat-file --batch-all-objects --batch-check='%(objectname)')
          Write-Host ('  objects enumerated : ' + $objects.Count)
          $probe = @($entries | ForEach-Object {
              $tab = $_.IndexOf("`t")
              if ($tab -gt 0) { ($_.Substring(0, $tab) -split ' ')[1] }
            } | Where-Object { $_ } | Select-Object -First 10)
          $readable = 0
          foreach ($sha in $probe) {
            & git -C $src cat-file -e $sha 2>$null
            if ($LASTEXITCODE -eq 0) { $readable++ }
          }
          Write-Host ('  cat-file -e probe  : ' + $readable + '/' + $probe.Count + ' sampled index blobs readable')
          foreach ($line in @(& git -C $src count-objects -v)) { Write-Host ('    ' + $line) }
          [IO.File]::AppendAllText($env:GITHUB_STEP_SUMMARY, ":warning: Repository hygiene guard reported issues (exit $guardExit); the build continued.`n")
          exit 0

      - name: Restore pinned LLVM cache
        if: env.CONCORD_LLVM_VERSION != 'image'
        id: llvm-cache
        uses: actions/cache/restore@v4
        with:
          path: D:\llvm-${{ env.CONCORD_LLVM_VERSION }}
          key: llvm-${{ env.CONCORD_LLVM_VERSION }}-win64-msvc-v1

      - name: Resolve toolchain
        # Writes LLVM_ROOT / CMAKE_EXE / NINJA_EXE / MSVC_ROOT / SDK_ROOT /
        # SDK_VERSION / MSVC_COMPAT_VERSION into the job environment.
        #
        # On a cache miss this downloads an 822 MB .tar.xz and expands it to
        # ~3.9 GB / 4,477 files. The download is quick on the hosted network
        # (~10 s); the expansion is single-threaded and takes minutes, and tar
        # prints nothing until it exits. It therefore runs as a monitored child
        # process that reports I/O progress, file count and the child's CPU time,
        # so a slow extraction can never be mistaken for a hung step.
        timeout-minutes: 45
        run: |
          $ErrorActionPreference = 'Stop'

          function Set-JobEnv([string]$Name, [string]$Value) {
            if ([string]::IsNullOrWhiteSpace($Value)) { throw "Empty value for $Name" }
            $utf8 = New-Object System.Text.UTF8Encoding($false)
            [IO.File]::AppendAllText($env:GITHUB_ENV, "$Name=$Value`n", $utf8)
            Write-Host "$Name = $Value"
          }

          function Get-TreeUsage([string]$Path) {
            # Best effort, used only for progress reporting. A file can vanish
            # between enumeration and stat during a live extraction, so every
            # stat is guarded on its own: one race must not zero the measurement
            # (which is exactly what made every heartbeat read "0 MB written").
            # The failure itself is returned instead of swallowed, so a broken
            # probe can no longer look like a stalled extraction.
            $count = 0
            $bytes = [int64]0
            $errorText = $null
            try {
              foreach ($file in [IO.Directory]::EnumerateFiles($Path, '*', [IO.SearchOption]::AllDirectories)) {
                $count++
                try { $bytes += (New-Object IO.FileInfo $file).Length } catch { }
              }
            } catch {
              $errorText = $_.Exception.GetType().Name + ': ' + $_.Exception.Message
            }
            New-Object psobject -Property @{ Files = $count; Bytes = $bytes; Error = $errorText }
          }

          # --- LLVM -----------------------------------------------------------
          if ($env:CONCORD_LLVM_VERSION -eq 'image') {
            $clangCli = Get-Command clang-cl.exe -ErrorAction SilentlyContinue
            if (-not $clangCli) { throw 'Runner LLVM requested but clang-cl.exe is not on PATH.' }
            $llvmRoot = Split-Path -Parent (Split-Path -Parent $clangCli.Source)
          } else {
            $version = $env:CONCORD_LLVM_VERSION
            $llvmRoot = "D:\llvm-$version"
            if (-not (Test-Path (Join-Path $llvmRoot 'bin\clang-cl.exe'))) {
              $asset = "clang+llvm-$version-x86_64-pc-windows-msvc.tar.xz"
              $url = "https://github.com/llvm/llvm-project/releases/download/llvmorg-$version/$asset"
              $archive = Join-Path $env:RUNNER_TEMP $asset
              Write-Host "Downloading $url"
              & curl.exe -L --fail --retry 3 --retry-delay 5 -o $archive $url
              if ($LASTEXITCODE -ne 0) { throw "LLVM $version download failed: $url" }
              New-Item -ItemType Directory -Force -Path $llvmRoot | Out-Null
              # bsdtar decodes xz on a single thread and prints nothing until it
              # exits, so it is driven as a child process with a heartbeat.
              # Two independent signals are reported, because a size probe alone
              # cannot tell "working" from "stuck":
              #   - bytes/files under the target directory (I/O progress),
              #   - the tar process' own CPU time (decode progress).
              $extractClock = [Diagnostics.Stopwatch]::StartNew()
              $start = New-Object Diagnostics.ProcessStartInfo
              $start.FileName = (Get-Command tar.exe -CommandType Application -ErrorAction Stop | Select-Object -First 1).Source
              # The destination is passed as the working directory instead of
              # "-C <path>": a misparsed quoted argument would silently extract
              # into the current directory, leaving the target empty while tar
              # happily keeps working.
              $start.WorkingDirectory = $llvmRoot
              $start.Arguments = '-xf "{0}" --strip-components 1' -f $archive
              $start.UseShellExecute = $false
              $start.CreateNoWindow = $true
              $start.RedirectStandardOutput = $true
              $start.RedirectStandardError = $true
              Write-Host ('  extractor: {0} -> {1}' -f $start.FileName, $llvmRoot)
              $tar = New-Object Diagnostics.Process
              $tar.StartInfo = $start
              [void]$tar.Start()
              $tarStdout = $tar.StandardOutput.ReadToEndAsync()
              $tarStderr = $tar.StandardError.ReadToEndAsync()

              $lastBytes = [int64]0
              $lastCpu = -1.0
              $idleBeats = 0
              while (-not $tar.WaitForExit(10000)) {
                $usage = Get-TreeUsage $llvmRoot
                $cpu = -1.0
                try {
                  $tar.Refresh()
                  if (-not $tar.HasExited) { $cpu = $tar.TotalProcessorTime.TotalSeconds }
                } catch { }
                if (($usage.Bytes -gt $lastBytes) -or ($cpu -gt $lastCpu + 0.5)) { $idleBeats = 0 } else { $idleBeats++ }
                $lastBytes = $usage.Bytes
                $lastCpu = $cpu
                $note = ''
                if ($usage.Error) { $note = '  [probe: ' + $usage.Error + ']' }
                Write-Host ('  extracting: {0,4:N0} s, tar CPU {1,5:N0} s, {2,5:N0} files, {3,7:N0} MB{4}' -f `
                    $extractClock.Elapsed.TotalSeconds, [math]::Max($cpu, 0), $usage.Files, ($usage.Bytes / 1MB), $note)
                if ($idleBeats -ge 30) {
                  # 5 minutes with neither I/O nor CPU movement: it is not slow,
                  # it is stuck. Fail with context instead of waiting for the
                  # 45 minute step timeout.
                  try { $tar.Kill() } catch { }
                  $partial = Get-TreeUsage $llvmRoot
                  $top = @(Get-ChildItem -LiteralPath $llvmRoot -Force -ErrorAction SilentlyContinue | Select-Object -First 20 -ExpandProperty Name)
                  throw ("LLVM extraction stopped making progress for " + ($idleBeats * 10) + " s" +
                         " (tar CPU " + [math]::Round([math]::Max($cpu, 0)) + " s, " + $partial.Files + " files, " +
                         [math]::Round($partial.Bytes / 1MB) + " MB)." +
                         " Target listing: " + ($top -join ', ') +
                         ". Free space on D: " + [math]::Round((Get-PSDrive D).Free / 1GB, 1) + ' GB.')
                }
              }
              $tar.WaitForExit()
              $tarExit = $tar.ExitCode
              $tarOutText = $tarStdout.GetAwaiter().GetResult()
              $tarErrText = $tarStderr.GetAwaiter().GetResult()
              $tar.Dispose()
              if ($tarOutText) { Write-Host $tarOutText }
              if ($tarErrText) { Write-Host $tarErrText }
              if ($tarExit -ne 0) { throw "LLVM $version extraction failed (exit $tarExit): $archive" }
              $final = Get-TreeUsage $llvmRoot
              Write-Host ('  extracted in {0:N0} s: {1:N0} files, {2:N0} MB' -f `
                  $extractClock.Elapsed.TotalSeconds, $final.Files, ($final.Bytes / 1MB))
              if ($final.Files -eq 0) {
                throw ("tar reported success but $llvmRoot is still empty, so the archive was expanded " +
                       "somewhere else (extraction cwd: " + $start.WorkingDirectory + ').')
              }
              Remove-Item -LiteralPath $archive -Force
            }
          }
          $absent = @()
          foreach ($tool in @('clang-cl.exe', 'lld-link.exe', 'llvm-lib.exe', 'llvm-readobj.exe')) {
            if (-not (Test-Path -LiteralPath (Join-Path $llvmRoot "bin\$tool") -PathType Leaf)) { $absent += $tool }
          }
          if ($absent.Count) {
            $top = @(Get-ChildItem -LiteralPath $llvmRoot -Force -ErrorAction SilentlyContinue | Select-Object -First 20 -ExpandProperty Name)
            throw ("LLVM under $llvmRoot is missing: " + ($absent -join ', ') + '. Target listing: ' + ($top -join ', '))
          }

          # --- CMake / Ninja (image-provided, minimum version enforced) -------
          $cmake = (Get-Command cmake.exe -ErrorAction SilentlyContinue).Source
          if (-not $cmake) { throw 'cmake.exe not found on PATH; this workflow expects the hosted Windows image.' }
          $cmakeVersion = ([version]((& $cmake --version)[0] -replace '^cmake version ')).ToString()
          if ([version]$cmakeVersion -lt [version]'3.20') { throw "CMake $cmakeVersion is older than the required 3.20" }

          $ninja = (Get-Command ninja.exe -ErrorAction SilentlyContinue).Source
          if (-not $ninja) {
            Write-Host 'ninja.exe missing; installing the pinned Chocolatey package.'
            choco install ninja -y --no-progress | Out-Host
            $ninja = (Get-Command ninja.exe -ErrorAction SilentlyContinue).Source
          }
          if (-not $ninja) { throw 'ninja.exe could not be located.' }

          # --- Microsoft C++ toolset and Windows SDK --------------------------
          # Discovered, never assumed: image updates change both versions.
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (-not (Test-Path -LiteralPath $vswhere)) { throw 'vswhere.exe not found; no VS-family C++ tools to discover.' }
          $vsPath = @(& $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath) | Select-Object -First 1
          if (-not $vsPath) { throw 'No complete MSVC x86/x64 toolset installation was found.' }
          $vsPath = $vsPath.Trim()

          $toolsRoot = Join-Path $vsPath 'VC\Tools\MSVC'
          $toolset = Get-ChildItem -LiteralPath $toolsRoot -Directory |
            Where-Object {
              $_.Name -match '^\d+\.\d+\.\d+$' -and
              (Test-Path (Join-Path $_.FullName 'include\vector')) -and
              (Test-Path (Join-Path $_.FullName 'lib\x64')) -and
              (Test-Path (Join-Path $_.FullName 'lib\x86'))
            } |
            Sort-Object { [version]$_.Name } -Descending |
            Select-Object -First 1
          if (-not $toolset) { throw "No usable MSVC toolset (x64+x86) under $toolsRoot" }
          $msvcRoot = $toolset.FullName

          # 14.44.35207 -> 19.44.35207, matching the cl.exe compatibility contract.
          $toolsetVersion = [version]$toolset.Name
          $compatVersion = "19.$($toolsetVersion.Minor).$($toolsetVersion.Build)"

          $sdkRoot = $null
          foreach ($candidate in @((Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10'), (Join-Path $env:ProgramFiles 'Windows Kits\10'))) {
            if (Test-Path -LiteralPath (Join-Path $candidate 'Include')) { $sdkRoot = $candidate; break }
          }
          if (-not $sdkRoot) { throw 'Windows 10/11 SDK root not found.' }

          $sdkVersion = Get-ChildItem -LiteralPath (Join-Path $sdkRoot 'Include') -Directory |
            Where-Object {
              $inc = $_.FullName
              $ver = $_.Name
              ($ver -match '^\d+\.\d+\.\d+(\.\d+)?$') -and
              (@(@('ucrt', 'shared', 'um', 'winrt', 'cppwinrt') | Where-Object { -not (Test-Path (Join-Path $inc $_)) }).Count -eq 0) -and
              (Test-Path (Join-Path $sdkRoot "bin\$ver\x64\rc.exe")) -and
              (Test-Path (Join-Path $sdkRoot "bin\$ver\x64\mt.exe"))
            } |
            Sort-Object { [version]$_.Name } -Descending |
            Select-Object -First 1
          if (-not $sdkVersion) { throw "No Windows SDK with rc.exe/mt.exe and the required include set under $sdkRoot" }

          Set-JobEnv 'LLVM_ROOT' $llvmRoot
          Set-JobEnv 'CMAKE_EXE' $cmake
          Set-JobEnv 'NINJA_EXE' $ninja
          Set-JobEnv 'MSVC_ROOT' $msvcRoot
          Set-JobEnv 'SDK_ROOT' $sdkRoot
          Set-JobEnv 'SDK_VERSION' $sdkVersion.Name
          Set-JobEnv 'MSVC_COMPAT_VERSION' $compatVersion

          # Recorded verbatim in the job summary and inside the package.
          $identity = @(
            "LLVM request: $env:CONCORD_LLVM_VERSION",
            "LLVM root: $llvmRoot",
            "CMake: $cmakeVersion ($cmake)",
            "Ninja: $((& $ninja --version)) ($ninja)",
            "MSVC toolset: $($toolset.Name)",
            "MSVC compat version: $compatVersion",
            "Windows SDK: $($sdkVersion.Name)",
            "PowerShell: $($PSVersionTable.PSVersion)"
          )
          $utf8 = New-Object System.Text.UTF8Encoding($false)
          [IO.File]::AppendAllText($env:GITHUB_ENV, "TOOLCHAIN_IDENTITY<<CONCORD_EOF`n$($identity -join "`n")`nCONCORD_EOF`n", $utf8)
          $identity | ForEach-Object { Write-Host $_ }

      - name: Save pinned LLVM cache
        # actions/cache only saves on job success, so a build that fails later
        # would pay for the download and extraction again on every retry.
        # Saving right after a successful resolve makes iterations cheap.
        # Uploading ~3.9 GB is itself silent for a few minutes; the timeout keeps
        # a pathological upload from eating the job budget (a failed save only
        # costs the next run a re-extraction, it does not fail the build).
        if: env.CONCORD_LLVM_VERSION != 'image' && steps.llvm-cache.outputs.cache-hit != 'true'
        timeout-minutes: 20
        uses: actions/cache/save@v4
        with:
          path: D:\llvm-${{ env.CONCORD_LLVM_VERSION }}
          key: llvm-${{ env.CONCORD_LLVM_VERSION }}-win64-msvc-v1

      - name: Preflight system dependency check
        # New-ClangStage resolves every PE import against System32/SysWOW64 and
        # fails late if a system DLL is absent. Surface that early instead.
        run: |
          $ErrorActionPreference = 'Stop'
          $required = @('winmm.dll', 'ws2_32.dll', 'bcrypt.dll', 'secur32.dll', 'crypt32.dll',
                        'comdlg32.dll', 'xaudio2_9.dll', 'ole32.dll')
          $missing = @()
          foreach ($dll in $required) {
            if (-not (Test-Path -LiteralPath (Join-Path $env:SystemRoot "System32\$dll"))) { $missing += $dll }
          }
          if ($missing.Count) {
            Write-Warning ("System DLLs not present on this runner: " + ($missing -join ', '))
            Write-Warning 'The link step may still succeed but staging verifies imports; expect a late failure.'
          } else {
            Write-Host 'All system dependencies referenced by the link line are present.'
          }

      - name: Build (Release, staged only)
        # -StageOnly builds, verifies architecture/imports/CRT/SHA-256 and produces
        # an isolated deployment-stage directory. Nothing is written to bin/.
        run: |
          $ErrorActionPreference = 'Stop'
          # Explicit string argv: splatting a hashtable into a native executable
          # would split the -StageOnly switch into '-StageOnly' + 'True'.
          $argv = @(
            '-NoProfile', '-ExecutionPolicy', 'Bypass',
            '-File', (Join-Path $env:PROJECT_ROOT 'tools\Build-Game.ps1'),
            '-BuildDirectory', $env:BUILD_DIR,
            '-Configuration', $env:CONFIGURATION,
            '-CMakeExecutable', $env:CMAKE_EXE,
            '-NinjaExecutable', $env:NINJA_EXE,
            '-LLVMRoot', $env:LLVM_ROOT,
            '-MSVCRoot', $env:MSVC_ROOT,
            '-WindowsSDKRoot', $env:SDK_ROOT,
            '-WindowsSDKVersion', $env:SDK_VERSION,
            '-MSVCCompatibilityVersion', $env:MSVC_COMPAT_VERSION,
            '-StageOnly'
          )
          & powershell @argv
          if ($LASTEXITCODE -ne 0) { throw "Build failed (exit $LASTEXITCODE)" }

      - name: Package build result
        id: package
        run: |
          $ErrorActionPreference = 'Stop'
          $stageRoot = Join-Path $env:BUILD_DIR 'deployment-stage'
          $stage = Get-ChildItem -LiteralPath $stageRoot -Directory |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $stage) { throw "No staged deployment under $stageRoot" }

          $provenance = Join-Path $stage.FullName 'build-provenance.json'
          if (-not (Test-Path -LiteralPath $provenance)) { throw "Missing build-provenance.json in $($stage.FullName)" }

          # Re-verify the two products independently of the build script.
          $x64 = Join-Path $stage.FullName 'concord_runtime.exe'
          $x86 = Join-Path $stage.FullName 'BinkFrameExtractor.exe'
          foreach ($pair in @(@($x64, 0x8664), @($x86, 0x014c))) {
            $file = $pair[0]
            if (-not (Test-Path -LiteralPath $file)) { throw "Missing build product: $file" }
            $stream = [IO.File]::OpenRead($file)
            $reader = New-Object IO.BinaryReader($stream)
            try {
              if ($reader.ReadUInt16() -ne 0x5a4d) { throw "Not a PE image: $file" }
              $stream.Position = 0x3c
              $offset = $reader.ReadInt32()
              $stream.Position = $offset
              [void]$reader.ReadUInt32()
              $machine = $reader.ReadUInt16()
            } finally { $reader.Dispose(); $stream.Dispose() }
            if ($machine -ne $pair[1]) { throw ("Unexpected PE machine 0x{0:x4} in {1}" -f $machine, $file) }
          }

          # "out/" lives next to the source clone and is never inside it, so the
          # package cannot pick up .git metadata.
          $dist = Join-Path $env:GITHUB_WORKSPACE 'out'
          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          $sourceCommit = $env:SOURCE_COMMIT
          if ($sourceCommit.Length -lt 12) { throw "Unexpected SOURCE_COMMIT value: '$sourceCommit'" }
          $zipName = "ConcordRTS-$($sourceCommit.Substring(0, 12))-windows-x64.zip"
          $zip = Join-Path $dist $zipName
          Compress-Archive -Path (Join-Path $stage.FullName '*') -DestinationPath $zip -Force

          $manifest = Get-Content -LiteralPath $provenance -Raw | ConvertFrom-Json
          $info = @(
            'ConcordRTS prebuilt package',
            '',
            "Source repository : $env:SOURCE_REPOSITORY",
            "Source ref        : $env:SOURCE_REF",
            "Source commit     : $sourceCommit",
            "Workflow repo     : $env:GITHUB_REPOSITORY",
            "Workflow run      : $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID",
            "Built at          : $((Get-Date).ToUniversalTime().ToString('o'))",
            '',
            'Toolchain',
            $env:TOOLCHAIN_IDENTITY,
            '',
            'Contents (name / SHA-256)'
          )
          $info += @($manifest.files | ForEach-Object { '  ' + $_.name + '  ' + $_.sha256 })
          $info += @('', 'This package contains engine binaries and Microsoft CRT redistributables only.')
          $info += @('Original RA2/YR game data, Binkw32.dll and retail assets are NOT included and must be supplied locally.')
          $infoPath = Join-Path $dist 'BUILD-INFO.txt'
          [IO.File]::WriteAllLines($infoPath, $info, (New-Object Text.UTF8Encoding($false)))

          Copy-Item -LiteralPath $provenance -Destination (Join-Path $dist 'build-provenance.json') -Force

          [IO.File]::AppendAllText($env:GITHUB_ENV, "ZIP_NAME=$zipName`n")

          Write-Host "Package: $zip"
          Get-ChildItem -LiteralPath $dist | ForEach-Object { Write-Host ("  {0}  {1:N0} bytes" -f $_.Name, $_.Length) }
          $manifest.files | ForEach-Object { Write-Host ("  {0}  {1}" -f $_.name, $_.sha256) }

      - name: Run asset-free regression tests
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_tests }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $runner = Join-Path $env:PROJECT_ROOT 'tools\testing\Run-LocalTests.ps1'
          if (-not (Test-Path -LiteralPath $runner -PathType Leaf)) {
            Write-Warning 'tools\testing\Run-LocalTests.ps1 is not present in this snapshot; skipping the test profile.'
            return
          }
          # Reset so a stale value from an earlier native command cannot mask a
          # script that exits 0 without running anything.
          $LASTEXITCODE = 0
          & $runner `
              -Compiler Clang `
              -BuildDirectory $env:BUILD_DIR `
              -Configuration $env:CONFIGURATION `
              -Profile windows-minimal
          if ($LASTEXITCODE -ne 0) { throw "windows-minimal test profile failed (exit $LASTEXITCODE)" }

      - name: Collect test results
        if: always() && (github.event_name != 'workflow_dispatch' || inputs.run_tests)
        run: |
          # Run-LocalTests resolves a relative OutputDirectory against the project
          # root (not the current directory), so read it back from there.
          $testRoot = Join-Path $env:PROJECT_ROOT 'build\local-tests'
          if (-not (Test-Path -LiteralPath $testRoot)) { Write-Host 'No test run directory.'; return }
          $run = Get-ChildItem -LiteralPath $testRoot -Directory |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1
          $results = Join-Path $run.FullName 'results.json'
          if (-not (Test-Path -LiteralPath $results)) { Write-Host "No results.json in $($run.FullName)"; return }
          [IO.File]::AppendAllText($env:GITHUB_ENV, "TEST_RESULTS_DIR=$($run.FullName)`n")
          $report = Get-Content -LiteralPath $results -Raw | ConvertFrom-Json
          $line = "passed={0} failed={1} skipped={2} not-built={3} not-run={4}" -f `
            $report.counts.passed, $report.counts.failed, $report.counts.skipped, $report.counts.'not-built', $report.counts.'not-run'
          Write-Host $line
          [IO.File]::AppendAllText($env:GITHUB_ENV, "TEST_SUMMARY=$line`n")

      - name: Upload build artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: concord-windows-x64
          path: |
            out/*.zip
            out/BUILD-INFO.txt
            out/build-provenance.json
          if-no-files-found: warn
          retention-days: 30

      - name: Upload test evidence
        if: always() && env.TEST_RESULTS_DIR != ''
        uses: actions/upload-artifact@v4
        with:
          name: concord-test-results
          path: ${{ env.TEST_RESULTS_DIR }}
          if-no-files-found: warn
          retention-days: 14

      - name: Write job summary
        if: always()
        run: |
          $lines = @()
          $lines += '### ConcordRTS - Windows x64 (clang-cl + Ninja)'
          $lines += ''
          $lines += '| Item | Value |'
          $lines += '| --- | --- |'
          $lines += '| Source repository | ' + $env:SOURCE_REPOSITORY + ' |'
          $lines += '| Source ref | ' + $env:SOURCE_REF + ' |'
          if ($env:SOURCE_COMMIT) { $lines += '| Source commit | `' + $env:SOURCE_COMMIT + '` |' }
          $lines += '| Workflow repo | ' + $env:GITHUB_REPOSITORY + '@' + $env:GITHUB_SHA.Substring(0, 7) + ' |'
          $lines += '| Trigger | ' + $env:GITHUB_EVENT_NAME + ' (' + $env:GITHUB_REF + ') |'
          $lines += '| Runner | ' + $env:RUNNER_OS + ' / ' + $env:RUNNER_ARCH + ' |'
          $lines += '| Project root | ' + $env:PROJECT_ROOT + ' |'
          $lines += '| Build directory | ' + $env:BUILD_DIR + ' |'
          if ($env:LLVM_ROOT) {
            $lines += '| LLVM | ' + $env:LLVM_ROOT + ' |'
            $lines += '| CMake | ' + $env:CMAKE_EXE + ' |'
            $lines += '| Ninja | ' + $env:NINJA_EXE + ' |'
            $lines += '| MSVC toolset | ' + $env:MSVC_ROOT + ' |'
            $lines += '| MSVC compat | ' + $env:MSVC_COMPAT_VERSION + ' |'
            $lines += '| Windows SDK | ' + $env:SDK_VERSION + ' |'
          }
          if ($env:ZIP_NAME) { $lines += '| Package | ' + $env:ZIP_NAME + ' |' }
          if ($env:TEST_SUMMARY) { $lines += '| Tests (windows-minimal) | ' + $env:TEST_SUMMARY + ' |' }
          $lines += ''
          $lines += 'Deployment staging performs its own PE architecture, import-resolution, CRT and SHA-256 checks; the package contains `build-provenance.json` with the full command and source-hash record.'
          [IO.File]::AppendAllText($env:GITHUB_STEP_SUMMARY, ($lines -join "`n") + "`n")

  release:
    name: Publish release assets
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-2022
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download package
        uses: actions/download-artifact@v4
        with:
          name: concord-windows-x64
          path: out

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The release belongs to this repository, but its content comes from
          # upstream; record which commit was actually built.
          RELEASE_SOURCE_COMMIT: ${{ needs.build.outputs.source_commit }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = $env:GITHUB_REF_NAME
          $zip = Get-ChildItem -LiteralPath 'out' -Filter *.zip | Select-Object -First 1
          if (-not $zip) { throw 'No package zip was downloaded.' }

          $lines = @(
            "Windows x64 build of ``$env:SOURCE_REPOSITORY`` at ``$env:SOURCE_REF``."
            ''
            "Source commit: ``$($env:RELEASE_SOURCE_COMMIT)``"
            ''
            'Built with clang-cl + Ninja (LLVM 22.1.3 toolchain contract). The zip contains'
            'BUILD-INFO.txt (toolchain identity, per-file SHA-256) and build-provenance.json.'
            ''
            'This package contains engine binaries and Microsoft CRT redistributables only.'
            'Original RA2/YR game data, Binkw32.dll and retail assets are not included and'
            'must be supplied locally.'
          ) -join "`n"

          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag exists; uploading the asset with --clobber."
            gh release upload $tag $zip.FullName --repo $env:GITHUB_REPOSITORY --clobber
          } else {
            gh release create $tag $zip.FullName --repo $env:GITHUB_REPOSITORY --title $tag --notes $lines
          }
          if ($LASTEXITCODE -ne 0) { throw "Release publishing failed (exit $LASTEXITCODE)" }
