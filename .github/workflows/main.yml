name: Build Craft Apps (Windows x64 + MSI)

on:
  workflow_dispatch:
    inputs:
      build_photocraft:
        description: 'Build PhotoCraft'
        required: true
        default: true
        type: boolean
      build_cadcraft:
        description: 'Build CADCraft'
        required: true
        default: true
        type: boolean

jobs:
  build:
    name: Build on Windows x64
    runs-on: windows-latest

    env:
      # 明确 MSVC 目标，保证产物路径可预测
      RUST_TARGET: "x86_64-pc-windows-msvc"

    steps:
      - name: Checkout your repository
        uses: actions/checkout@v4

      # ---------------------------------------------------------------
      # 公共依赖：Rust + WiX
      # ---------------------------------------------------------------
      - name: Setup Rust
        if: ${{ inputs.build_photocraft || inputs.build_cadcraft }}
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install cargo-wix
        if: ${{ inputs.build_photocraft || inputs.build_cadcraft }}
        run: |
          cargo install cargo-wix --version "^0.3" --locked

      - name: Install WiX Toolset v3
        if: ${{ inputs.build_photocraft || inputs.build_cadcraft }}
        run: |
          choco install wixtoolset --version=3.14.1 -y --no-progress
          echo "C:\Program Files (x86)\WiX Toolset v3.14\bin" >> $env:GITHUB_PATH

      # ===============================================================
      # PhotoCraft
      # ===============================================================
      - name: Checkout PhotoCraft
        if: ${{ inputs.build_photocraft }}
        uses: actions/checkout@v4
        with:
          repository: storytold/photocraft
          path: ./photocraft
          ref: 'main'

      - name: Build PhotoCraft (release)
        if: ${{ inputs.build_photocraft }}
        working-directory: ./photocraft
        run: |
          cargo build --release -p photocraft --target $env:RUST_TARGET

      # 从 Cargo.toml 解析版本号，写入环境变量 APP_VERSION
      - name: Resolve PhotoCraft version
        if: ${{ inputs.build_photocraft }}
        working-directory: ./photocraft
        shell: pwsh
        run: |
          # 只读取 [package] 段的 version，避免误取 workspace/dependencies 中的版本
          $content = Get-Content Cargo.toml -Raw
          $match = [regex]::Match($content, '(?ms)^\[package\].*?^version\s*=\s*"([^"]+)"')
          if (-not $match.Success) {
            throw "无法从 Cargo.toml 解析 [package] version"
          }
          $version = $match.Groups[1].Value
          Write-Host "PhotoCraft version = $version"
          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Package PhotoCraft MSI
        if: ${{ inputs.build_photocraft }}
        working-directory: ./photocraft
        shell: pwsh
        run: |
          $wxs = Get-ChildItem -Path .\packaging -Recurse -Filter *.wxs -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($wxs) {
            Write-Host "Using existing WiX template: $($wxs.FullName)"
            (Get-Content $wxs.FullName) -replace '\{\{VERSION\}\}', $env:APP_VERSION | Set-Content $wxs.FullName
            candle.exe -arch x64 -out packaging\product.wixobj $wxs.FullName
            light.exe -out "photocraft-$env:APP_VERSION-windows-x64.msi" packaging\product.wixobj
          } else {
            cargo wix init
            (Get-Content Cargo.toml) -replace '^version\s*=\s*".*"', "version = `"$env:APP_VERSION`"" | Set-Content Cargo.toml
            cargo wix --no-build --target $env:RUST_TARGET --nocapture --output "photocraft-$env:APP_VERSION-windows-x64.msi"
          }

      - name: Upload PhotoCraft MSI
        if: ${{ inputs.build_photocraft }}
        uses: actions/upload-artifact@v4
        with:
          name: photocraft-windows-x64-msi
          path: ./photocraft/photocraft-*-windows-x64.msi
          if-no-files-found: error

      - name: Upload PhotoCraft EXE
        if: ${{ inputs.build_photocraft }}
        uses: actions/upload-artifact@v4
        with:
          name: photocraft-windows-x64-exe
          path: ./photocraft/target/x86_64-pc-windows-msvc/release/photocraft.exe

      # ===============================================================
      # CADCraft
      # ===============================================================
      - name: Checkout CADCraft
        if: ${{ inputs.build_cadcraft }}
        uses: actions/checkout@v4
        with:
          repository: storytold/cadcraft
          path: ./cadcraft
          ref: 'main'

      - name: Build CADCraft (release)
        if: ${{ inputs.build_cadcraft }}
        working-directory: ./cadcraft
        run: |
          cargo build --release -p cadcraft --target $env:RUST_TARGET

      # 从 Cargo.toml 解析版本号，写入环境变量 APP_VERSION
      - name: Resolve CADCraft version
        if: ${{ inputs.build_cadcraft }}
        working-directory: ./cadcraft
        shell: pwsh
        run: |
          $content = Get-Content Cargo.toml -Raw
          $match = [regex]::Match($content, '(?ms)^\[package\].*?^version\s*=\s*"([^"]+)"')
          if (-not $match.Success) {
            throw "无法从 Cargo.toml 解析 [package] version"
          }
          $version = $match.Groups[1].Value
          Write-Host "CADCraft version = $version"
          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Package CADCraft MSI
        if: ${{ inputs.build_cadcraft }}
        working-directory: ./cadcraft
        shell: pwsh
        run: |
          $wxs = Get-ChildItem -Path .\packaging -Recurse -Filter *.wxs -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($wxs) {
            Write-Host "Using existing WiX template: $($wxs.FullName)"
            (Get-Content $wxs.FullName) -replace '\{\{VERSION\}\}', $env:APP_VERSION | Set-Content $wxs.FullName
            candle.exe -arch x64 -out packaging\product.wixobj $wxs.FullName
            light.exe -out "cadcraft-$env:APP_VERSION-windows-x64.msi" packaging\product.wixobj
          } else {
            cargo wix init
            (Get-Content Cargo.toml) -replace '^version\s*=\s*".*"', "version = `"$env:APP_VERSION`"" | Set-Content Cargo.toml
            cargo wix --no-build --target $env:RUST_TARGET --nocapture --output "cadcraft-$env:APP_VERSION-windows-x64.msi"
          }

      - name: Upload CADCraft MSI
        if: ${{ inputs.build_cadcraft }}
        uses: actions/upload-artifact@v4
        with:
          name: cadcraft-windows-x64-msi
          path: ./cadcraft/cadcraft-*-windows-x64.msi
          if-no-files-found: error

      - name: Upload CADCraft EXE
        if: ${{ inputs.build_cadcraft }}
        uses: actions/upload-artifact@v4
        with:
          name: cadcraft-windows-x64-exe
          path: ./cadcraft/target/x86_64-pc-windows-msvc/release/cadcraft.exe
