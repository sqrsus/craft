# =============================================================================
#  仓库级 GitHub Actions 运行记录 / 产物自动清理
# -----------------------------------------------------------------------------
#  目标
#    对仓库中的「每一个工作流」分别保留最近 KEEP 次（默认 3 次）运行。
#    其余运行记录先逐条删除其关联 artifacts，再删除 run 本身；run 删除时
#    GitHub 还会级联删除日志与残留产物。最后再做一次孤儿产物兜底扫描。
#
#  触发条件
#    - schedule            : 每日 UTC 03:23（北京时间 11:23）自动执行。
#    - workflow_dispatch   : 在 Actions 页面手动执行，可覆盖参数、可 dry-run。
#    注意：schedule 只会在默认分支上的工作流文件生效；本文件必须提交到默认
#    分支（main）后定时任务才会运行。workflow_dispatch 同样只显示默认分支
#    上的版本。
#
#  清理范围
#    - 仓库内所有工作流的运行记录（按 workflow_id 分组，包含已禁用的工作流；
#      已删除工作流文件遗留的历史 run 只要 API 能返回也会被纳入）。
#    - 每个工作流最近 KEEP 次之外的运行记录。
#    - 上述运行记录关联的全部 artifacts（先显式删除，再删 run 兜底）。
#    - 孤儿 artifacts：所属 run 已不存在且已过期的产物（可关闭）。
#    - 不处理：最近 KEEP 次运行及其产物、当前正在执行的 run、处于
#      queued/in_progress/waiting/requested/pending 状态的 run。
#
#  保留策略
#    - 以 workflow_id 为单位，按 created_at 倒序，前 KEEP 条保留。
#    - KEEP 默认 3；手动触发时可改为 1..100，但最小为 1，避免误删当前运行。
#    - dry_run=true 时只打印将删除的对象，不调用任何 DELETE 接口。
#    - 运行中的 run 即使已超出 KEEP 条也绝不删除，留待其结束后下次清理。
#
#  失败处理
#    - 所有 API 调用带重试：429/5xx/网络错误使用指数退避；403 限流读取
#      Retry-After / x-ratelimit-reset；404/410 视为对象已不存在（幂等成功）。
#    - 401/403 权限错误会记录响应并重试一次；仍失败则 fail-fast，停止后续
#      删除并在 Job Summary 中给出 permissions: actions: write 提示。
#    - 单条 run 删除失败不会中断整批；失败明细写入 Job Summary，并以
#      core.setFailed 让本次工作流标记为失败，便于告警和下次重试。
#    - 逐条 DELETE 之间默认 sleep 1s，降低触发二级速率限制的概率。
#
#  必要配置
#    - permissions.actions: write（删除 run/artifact 必需；只读 token 会 403）。
#    - 使用内置 GITHUB_TOKEN 即可，无需额外 Secrets；不需要 checkout 代码。
#    - 若仓库开启了 Actions 的 fork PR 限制，本工作流不受影响（仅 schedule/
#      workflow_dispatch）。
#    - 仓库中若已有其他清理工作流（例如 clean.yml），请删除或禁用它，避免
#      两个清理任务重复删除、互相干扰。本文件与旧文件的 concurrency group
#      保持一致，即使同时存在也会串行执行。
# =============================================================================

name: Cleanup Workflow Runs and Artifacts

on:
  schedule:
    # UTC 03:23 = 北京时间 11:23，避开构建高峰。
    - cron: '23 3 * * *'
  workflow_dispatch:
    inputs:
      keep:
        description: '每个工作流保留的最近运行次数（默认 3，最小 1）'
        required: false
        default: '2'
        type: string
      dry_run:
        description: '预演模式：只打印将删除的对象，不真正删除'
        required: false
        default: false
        type: boolean
      max_pages:
        description: '仓库运行记录最多翻页数（每页 100 条，默认 50）'
        required: false
        default: '50'
        type: string
      retry_attempts:
        description: 'API 调用最大尝试次数（默认 4）'
        required: false
        default: '4'
        type: string
      delete_delay_ms:
        description: '每次删除后的间隔毫秒数（默认 1000，用于限流保护）'
        required: false
        default: '1000'
        type: string
      sweep_orphans:
        description: '是否清理所属 run 已删除且已过期的孤儿产物（默认 true）'
        required: false
        default: true
        type: boolean

# 删除 run / artifact 需要 actions: write。采用最小权限，不额外授予 contents。
permissions:
  actions: write

# 与旧清理工作流共用同一个 group：即使两个文件同时存在，也不会并发删除。
concurrency:
  group: cleanup-actions-runs
  cancel-in-progress: false

jobs:
  cleanup:
    name: Prune old runs and artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      # schedule 事件没有 inputs，使用 || 提供默认值。
      KEEP: ${{ github.event.inputs.keep || '3' }}
      DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
      MAX_PAGES: ${{ github.event.inputs.max_pages || '50' }}
      RETRY_ATTEMPTS: ${{ github.event.inputs.retry_attempts || '4' }}
      DELETE_DELAY_MS: ${{ github.event.inputs.delete_delay_ms || '1000' }}
      SWEEP_ORPHANS: ${{ github.event.inputs.sweep_orphans || 'true' }}

    steps:
      - name: Prune workflow runs and artifacts
        uses: actions/github-script@v7
        with:
          script: |
            // -----------------------------------------------------------------
            // 参数解析与校验（全部来自 env，避免把输入直接插值进脚本）
            // -----------------------------------------------------------------
            const keep = Number(process.env.KEEP);
            const dryRun = String(process.env.DRY_RUN).toLowerCase() === 'true';
            const maxPages = Number(process.env.MAX_PAGES);
            const retryAttempts = Number(process.env.RETRY_ATTEMPTS);
            const deleteDelayMs = Number(process.env.DELETE_DELAY_MS);
            const sweepOrphans = String(process.env.SWEEP_ORPHANS).toLowerCase() === 'true';

            function requireInt(name, value, min, max) {
              if (!Number.isInteger(value) || value < min || value > max) {
                throw new Error(`${name} 必须是 ${min}..${max} 之间的整数，当前值: ${value}`);
              }
            }
            requireInt('keep', keep, 1, 100);
            requireInt('max_pages', maxPages, 1, 1000);
            requireInt('retry_attempts', retryAttempts, 1, 10);
            requireInt('delete_delay_ms', deleteDelayMs, 0, 60000);

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const currentRunId = context.runId;
            const activeStatuses = new Set([
              'in_progress', 'queued', 'waiting', 'requested', 'pending'
            ]);

            const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

            // -----------------------------------------------------------------
            // 清理状态
            // -----------------------------------------------------------------
            let deletedRuns = 0;
            let deletedArtifacts = 0;
            let artifactSoftFailures = 0;
            const failures = [];
            const protectedRunIds = new Set();
            let permissionFailure = null;

            // -----------------------------------------------------------------
            // 带重试的 API 调用
            //   - 429 / 5xx / 网络错误：指数退避（5s, 10s, 20s ...，上限 120s）
            //   - 403 限流：优先使用 Retry-After / x-ratelimit-reset
            //   - 401/403 权限错误：重试一次；仍失败则记录并 fail-fast
            //   - 404：直接抛给调用方，由调用方按幂等成功处理
            // -----------------------------------------------------------------
            async function withRetry(label, fn) {
              if (permissionFailure) throw permissionFailure;

              let lastError;
              for (let attempt = 1; attempt <= retryAttempts; attempt++) {
                try {
                  return await fn();
                } catch (error) {
                  lastError = error;
                  const status = error.status;
                  const headers = (error.response && error.response.headers) || {};
                  const rawMessage =
                    (error.response && error.response.data && error.response.data.message) ||
                    error.message ||
                    '';
                  const message = typeof rawMessage === 'string' ? rawMessage : JSON.stringify(rawMessage);
                  const detail = `HTTP ${status == null ? 'N/A' : status}${message ? `: ${message}` : ''}`;

                  if (status === 404 || status === 410) {
                    core.info(`[${label}] 对象不存在（HTTP ${status}）`);
                    throw error;
                  }

                  const messageLower = message.toLowerCase();
                  const isRateLimit =
                    status === 429 ||
                    (status === 403 &&
                      (messageLower.includes('rate limit') ||
                        String(headers['x-ratelimit-remaining']) === '0' ||
                        headers['retry-after'] !== undefined));
                  const isPermission =
                    status === 401 || (status === 403 && !isRateLimit);

                  if (isPermission) {
                    // 权限错误通常不会自愈；最多重试一次，避免对每个对象反复撞墙。
                    const permissionRetryLimit = Math.min(2, retryAttempts);
                    if (attempt >= permissionRetryLimit) {
                      permissionFailure = error;
                      failures.push({ type: 'permission', id: 'GITHUB_TOKEN', message: detail });
                      core.error(`[${label}] 权限错误，重试后仍失败：${detail}`);
                      core.error('请确认本工作流具有 permissions: actions: write，且仓库策略允许 GITHUB_TOKEN 写入 Actions。');
                      throw error;
                    }
                    core.warning(`[${label}] 权限错误（第 ${attempt}/${permissionRetryLimit} 次）：${detail}；5 秒后重试一次`);
                    await sleep(5000);
                    continue;
                  }

                  if (attempt === retryAttempts) {
                    core.error(`[${label}] 已重试 ${retryAttempts} 次仍失败：${detail}`);
                    break;
                  }

                  let waitMs = Math.min(120000, 5000 * 2 ** (attempt - 1));
                  if (headers['retry-after'] !== undefined) {
                    const retryAfter = Number(headers['retry-after']);
                    if (Number.isFinite(retryAfter)) {
                      waitMs = Math.min(120000, Math.max(1000, retryAfter * 1000));
                    }
                  } else if (isRateLimit && headers['x-ratelimit-reset'] !== undefined) {
                    const reset = Number(headers['x-ratelimit-reset']);
                    if (Number.isFinite(reset)) {
                      waitMs = Math.min(120000, Math.max(1000, reset * 1000 - Date.now()));
                    }
                  }

                  core.warning(
                    `[${label}] 失败（第 ${attempt}/${retryAttempts} 次，${detail}）；` +
                    `${Math.ceil(waitMs / 1000)} 秒后重试`
                  );
                  await sleep(waitMs);
                }
              }
              throw lastError;
            }

            // -----------------------------------------------------------------
            // 读取仓库全部运行记录
            //   如果仓库运行量很大，超过 max_pages 的更早记录会在后续每天的
            //   执行中继续清理（清理后总量会快速收敛到 3 条/工作流）。
            // -----------------------------------------------------------------
            async function listAllRuns() {
              const allRuns = [];
              for (let page = 1; page <= maxPages; page++) {
                const { data } = await withRetry(
                  `列出仓库运行记录（第 ${page} 页）`,
                  () => github.rest.actions.listWorkflowRunsForRepo({
                    owner,
                    repo,
                    per_page: 100,
                    page,
                    sort: 'created',
                    direction: 'desc'
                  })
                );
                allRuns.push(...data.workflow_runs);
                core.info(`已读取第 ${page} 页，累计 ${allRuns.length} 条运行记录`);
                if (data.workflow_runs.length < 100) break;
                if (page === maxPages) {
                  core.warning(`已达到翻页上限 ${maxPages} 页，更早的运行记录将在下次执行时处理`);
                }
              }
              return allRuns;
            }

            // -----------------------------------------------------------------
            // 读取单个 run 的全部 artifacts
            // -----------------------------------------------------------------
            async function listRunArtifacts(runId) {
              const artifacts = [];
              for (let page = 1; page <= maxPages; page++) {
                let data;
                try {
                  ({ data } = await withRetry(
                    `列出 run ${runId} 的产物（第 ${page} 页）`,
                    () => github.rest.actions.listWorkflowRunArtifacts({
                      owner,
                      repo,
                      run_id: runId,
                      per_page: 100,
                      page
                    })
                  ));
                } catch (error) {
                  if (error.status === 404 || error.status === 410) return artifacts;
                  throw error;
                }
                artifacts.push(...data.artifacts);
                if (data.artifacts.length < 100) break;
                if (page === maxPages) {
                  core.warning(`run ${runId} 的产物达到翻页上限 ${maxPages} 页，剩余产物将由 run 级联删除清理`);
                }
              }
              return artifacts;
            }

            // -----------------------------------------------------------------
            // 删除单个 artifact；404 视为已清理。
            // 直删失败不立即让任务失败：随后删除 run 时 GitHub 会级联删除。
            // -----------------------------------------------------------------
            async function deleteArtifactWithRetry(artifact, label) {
              try {
                await withRetry(
                  `删除产物 ${artifact.id}（${label}）`,
                  () => github.rest.actions.deleteArtifact({
                    owner,
                    repo,
                    artifact_id: artifact.id
                  })
                );
                deletedArtifacts += 1;
                core.info(`已删除产物 ${artifact.id}（${artifact.name}）`);
                return true;
              } catch (error) {
                if (error.status === 404 || error.status === 410) {
                  core.info(`产物 ${artifact.id} 已不存在（HTTP ${error.status}），视为已清理`);
                  return true;
                }
                artifactSoftFailures += 1;
                core.warning(`产物 ${artifact.id} 直删失败，稍后由 run 级联删除兜底：${error.message}`);
                return false;
              }
            }

            // -----------------------------------------------------------------
            // 删除单个 run；404 视为已清理。
            // -----------------------------------------------------------------
            async function deleteRunWithRetry(run) {
              try {
                await withRetry(
                  `删除运行记录 ${run.id}`,
                  () => github.rest.actions.deleteWorkflowRun({
                    owner,
                    repo,
                    run_id: run.id
                  })
                );
                deletedRuns += 1;
                core.info(`已删除运行记录 ${run.id}`);
                return true;
              } catch (error) {
                if (error.status === 404 || error.status === 410) {
                  deletedRuns += 1;
                  core.info(`运行记录 ${run.id} 已不存在（HTTP ${error.status}），视为已清理`);
                  return true;
                }
                failures.push({
                  type: 'run',
                  id: run.id,
                  name: run.name || run.path || '',
                  message: error.message
                });
                core.error(`删除运行记录 ${run.id} 失败：${error.message}`);
                return false;
              }
            }

            // -----------------------------------------------------------------
            // 主流程：分组 -> 计算保留集 -> 删除超出的 run 及其 artifacts
            // -----------------------------------------------------------------
            core.info(
              `开始清理：repo=${owner}/${repo}, keep=${keep}, dry_run=${dryRun}, ` +
              `max_pages=${maxPages}, retry_attempts=${retryAttempts}, ` +
              `delete_delay_ms=${deleteDelayMs}, sweep_orphans=${sweepOrphans}`
            );

            const runs = await listAllRuns();

            // 按 workflow_id 分组；全局列表按 created_at 倒序，组内顺序同样倒序。
            const groups = new Map();
            for (const run of runs) {
              const key = run.workflow_id == null ? `unknown:${run.path || 'unknown'}` : run.workflow_id;
              if (!groups.has(key)) groups.set(key, []);
              groups.get(key).push(run);
            }

            const staleRuns = [];
            const staleRunIds = new Set();

            for (const [workflowId, workflowRuns] of groups) {
              let kept = 0;
              let staleForWorkflow = 0;

              for (const run of workflowRuns) {
                if (run.id === currentRunId) protectedRunIds.add(run.id);
                if (activeStatuses.has(run.status)) protectedRunIds.add(run.id);

                // 每个工作流的前 KEEP 条（最新）保留。
                if (kept < keep) {
                  kept += 1;
                  continue;
                }

                // 当前运行和运行中的 run 永不删除，留待下次清理。
                if (run.id === currentRunId || activeStatuses.has(run.status)) {
                  core.info(`保护 run ${run.id}（状态 ${run.status}），本轮不删除`);
                  continue;
                }

                staleRuns.push(run);
                staleRunIds.add(run.id);
                staleForWorkflow += 1;
              }

              const sample = workflowRuns[0] || {};
              core.info(
                `工作流 ${workflowId}（${sample.name || sample.path || '未知'}）：` +
                `共 ${workflowRuns.length} 条，保留 ${kept} 条，待删除 ${staleForWorkflow} 条`
              );
            }

            if (dryRun) {
              for (const run of staleRuns) {
                core.info(
                  `[DRY-RUN] 将删除 run ${run.id} | workflow ${run.workflow_id} | ` +
                  `${run.name || run.path || ''} | created ${run.created_at}`
                );
              }
              core.info(`[DRY-RUN] 共 ${staleRuns.length} 条运行记录符合删除条件，未执行任何删除`);
            } else {
              for (const run of staleRuns) {
                core.startGroup(
                  `清理 run ${run.id} | workflow ${run.workflow_id} | ` +
                  `${run.name || run.path || ''} | created ${run.created_at}`
                );

                let artifacts = [];
                try {
                  artifacts = await listRunArtifacts(run.id);
                } catch (error) {
                  core.warning(
                    `无法列出 run ${run.id} 的产物，将直接删除 run 以触发级联清理：${error.message}`
                  );
                }

                core.info(`发现 ${artifacts.length} 个关联产物`);
                let allArtifactsDeleted = true;
                for (const artifact of artifacts) {
                  if (permissionFailure) {
                    allArtifactsDeleted = false;
                    break;
                  }
                  const ok = await deleteArtifactWithRetry(artifact, `run ${run.id}`);
                  if (!ok) allArtifactsDeleted = false;
                  if (deleteDelayMs > 0) await sleep(deleteDelayMs);
                }

                if (permissionFailure) {
                  core.error('检测到不可恢复的权限错误，停止处理剩余运行记录（下次执行会继续重试）');
                  core.endGroup();
                  break;
                }

                const runDeleted = await deleteRunWithRetry(run);
                if (runDeleted && !allArtifactsDeleted) {
                  core.info(`run ${run.id} 已删除，未直删成功的产物已由 GitHub 级联删除兜底`);
                }

                core.endGroup();
                if (deleteDelayMs > 0) await sleep(deleteDelayMs);
              }
            }

            // -----------------------------------------------------------------
            // 孤儿产物兜底：所属 run 已删除（workflow_run 为空）且已过期，
            // 或仍挂在已判定为 stale 的 run 下。不会触碰保留运行/运行中运行的产物。
            // -----------------------------------------------------------------
            if (sweepOrphans && !dryRun && !permissionFailure) {
              core.startGroup('孤儿产物兜底清理');
              try {
                const allArtifacts = [];
                for (let page = 1; page <= maxPages; page++) {
                  const { data } = await withRetry(
                    `列出仓库产物（第 ${page} 页）`,
                    () => github.rest.actions.listArtifactsForRepo({
                      owner,
                      repo,
                      per_page: 100,
                      page
                    })
                  );
                  allArtifacts.push(...data.artifacts);
                  if (data.artifacts.length < 100) break;
                  if (page === maxPages) {
                    core.warning(`仓库产物达到翻页上限 ${maxPages} 页，剩余产物将在下次执行时处理`);
                  }
                }

                const candidates = allArtifacts.filter((artifact) => {
                  const run = artifact.workflow_run;
                  const runId = run && run.id;
                  if (runId != null) return staleRunIds.has(runId);
                  return artifact.expired === true;
                });

                core.info(`仓库产物总数 ${allArtifacts.length}，待清理孤儿/残留产物 ${candidates.length}`);
                for (const artifact of candidates) {
                  if (permissionFailure) break;
                  await deleteArtifactWithRetry(artifact, '孤儿产物');
                  if (deleteDelayMs > 0) await sleep(deleteDelayMs);
                }
              } catch (error) {
                failures.push({ type: 'orphan-sweep', id: 'n/a', message: error.message });
                core.error(`孤儿产物兜底清理失败：${error.message}`);
              } finally {
                core.endGroup();
              }
            }

            // -----------------------------------------------------------------
            // 汇总输出
            // -----------------------------------------------------------------
            const summaryLines = [
              '## Actions 清理结果',
              '',
              '| 指标 | 数值 |',
              '| --- | --- |',
              `| 扫描工作流数 | ${groups.size} |`,
              `| 扫描运行记录数 | ${runs.length} |`,
              `| 本轮待删除运行数 | ${staleRuns.length} |`,
              `| 已删除运行记录 | ${deletedRuns} |`,
              `| 已删除产物 | ${deletedArtifacts} |`,
              `| 产物直删失败（已由 run 级联兜底） | ${artifactSoftFailures} |`,
              `| 受保护运行（运行中/当前） | ${protectedRunIds.size} |`,
              `| 未解决失败 | ${failures.length} |`,
              '',
              `- 保留策略：每个工作流保留最近 **${keep}** 次运行及其产物`,
              `- 预演模式：**${dryRun}**`,
              `- 孤儿产物清理：**${sweepOrphans && !dryRun}**`,
              `- 触发方式：每日定时（UTC 03:23）/ 手动 workflow_dispatch`,
            ];

            if (permissionFailure) {
              summaryLines.push(
                '',
                '> **权限错误**：请检查工作流是否声明 `permissions: actions: write`，',
                '> 以及仓库设置是否允许 `GITHUB_TOKEN` 写入 Actions。'
              );
            }

            if (failures.length > 0) {
              summaryLines.push('', '### 失败明细', '');
              for (const failure of failures.slice(0, 50)) {
                summaryLines.push(`- \`${failure.type}\` ${failure.id}: ${failure.message}`);
              }
              if (failures.length > 50) {
                summaryLines.push(`- ... 另有 ${failures.length - 50} 项，详见运行日志`);
              }
            }

            core.summary.addRaw(summaryLines.join('\n'));
            await core.summary.write();

            if (failures.length > 0) {
              core.setFailed(`清理完成，但有 ${failures.length} 个未解决失败；详见 Job Summary。`);
            } else {
              core.info(
                `清理完成：删除 ${deletedRuns} 条运行记录、${deletedArtifacts} 个产物，` +
                `保留策略为每个工作流最近 ${keep} 次运行。`
              );
