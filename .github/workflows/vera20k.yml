name: Build vera20k (manual + scheduled)

# Cross-repo release workflow.
#
# This workflow lives in YOUR repository, but it builds the source code that
# lives in a SEPARATE repository (YuriPlanet/vera20k). Because the two are
# different repos, the default `actions/checkout` would fetch THIS repo (which
# has no Cargo.toml) and `cargo` would fail with
# "cargo manifest path '.../Cargo.toml' does not exist" (the doubled
# `.../craft/craft/Cargo.toml` in the logs is a working-directory override
# pointing one level below that wrong, empty checkout).
#
# The fix: explicitly check out the SOURCE repo at the chosen ref, build
# Windows x64 only, and publish the pre-release into THIS (workflow) repo.
#
# Triggers
#   * workflow_dispatch - manual run with an explicit `ref` (tag or branch).
#   * schedule          - twice a day, 08:30 and 20:30 Beijing time.
#     A cron run carries NO inputs, so it builds the fallback ref (`main`) and
#     the `publish` job is skipped automatically (its `if:` requires a `v*`
#     ref). i.e. scheduled runs are build/verification only, no release.
#     Caveats of `schedule`: it only fires from this repo's DEFAULT branch, and
#     GitHub runs crons on a best-effort basis (often a few minutes late, and
#     more under peak load).
#   * `push: tags` is intentionally NOT used: tags pushed to vera20k do not
#     fire workflows in this repo.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Ref of YuriPlanet/vera20k to build (tag like v0.1.0, or a branch)'
        required: true
        default: 'main'
  schedule:
    # GitHub cron is ALWAYS UTC. Beijing time is UTC+8, so:
    #   08:30 Beijing = 00:30 UTC
    #   20:30 Beijing = 12:30 UTC
    - cron: '40 0 * * *'    # 08:30 北京时间
    - cron: '35 12 * * *'   # 20:30 北京时间

permissions:
  contents: read

env:
  SOURCE_REPO: YuriPlanet/vera20k
  # Single source of truth for the ref being built:
  #   - workflow_dispatch -> the `ref` input
  #   - schedule          -> no inputs exist, so fall back to `main`
  # Everything below (checkout, tag/version check, archive naming) reads this,
  # so manual and scheduled runs stay consistent.
  BUILD_REF: ${{ github.event.inputs.ref || 'main' }}
  # rust-lld ships with rustup and links much faster than link.exe. Linking the
  # C runtime statically removes the program's need for VCRUNTIME140.dll.
  CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER: rust-lld
  CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: -C target-feature=+crt-static

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows-x64
    # Surface Cargo.toml metadata to dependent jobs (publish uses pkg_name).
    outputs:
      pkg_name: ${{ steps.meta.outputs.name }}
      pkg_version: ${{ steps.meta.outputs.version }}
    defaults:
      run:
        # The source checkout lands at the workspace root, so all cargo/paths
        # resolve here. No repo-relative working-directory override.
        working-directory: ${{ github.workspace }}
    steps:
      # Must run BEFORE the checkout, otherwise the files on disk are already
      # written and the setting has no effect (the metadata `sed` below would
      # see CRLF line endings and fail to match).
      - name: Force LF line endings for the checkout
        if: runner.os == 'Windows'
        shell: bash
        run: git config --global core.autocrlf false
      - name: Check out the SOURCE repo (cross-repo)
        uses: actions/checkout@v7
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ env.BUILD_REF }}
          # For a PRIVATE source repo, add: token: ${{ secrets.RELEASE_TOKEN }}
      - name: Read package metadata from Cargo.toml
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          # Read [package] name/version from the SOURCE repo's Cargo.toml at root.
          name="$(sed -n 's/^name = "\([^"]*\)"$/\1/p' Cargo.toml | head -n 1)"
          version="$(sed -n 's/^version = "\([^"]*\)"$/\1/p' Cargo.toml | head -n 1)"
          if [ -z "$name" ] || [ -z "$version" ]; then
            echo "Failed to read name/version from Cargo.toml" >&2
            exit 1
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Require the ref to match the Cargo.toml version
        # Skipped for scheduled runs, where BUILD_REF is a branch (`main`).
        if: startsWith(env.BUILD_REF, 'v')
        shell: bash
        run: |
          if [ "v${{ steps.meta.outputs.version }}" != "${{ env.BUILD_REF }}" ]; then
            echo "Ref ${{ env.BUILD_REF }} does not match Cargo.toml version ${{ steps.meta.outputs.version }} (expected v${{ steps.meta.outputs.version }})" >&2
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about@0.9.2
      - name: Third-party license notices
        shell: bash
        run: |
          mkdir -p dist
          cargo about generate --locked --fail -c .github/release/about.toml \
            -o dist/THIRD_PARTY_LICENSES.html .github/release/about.hbs
      - uses: Swatinem/rust-cache@v2
      - name: Build the game
        run: cargo build --release --locked --bin ${{ steps.meta.outputs.name }}
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          name="${{ steps.meta.outputs.name }}"
          cv="${{ steps.meta.outputs.version }}"
          ref="${{ env.BUILD_REF }}"
          # Archive version: keep the `v` prefix when building a tag (matches the
          # release tag), otherwise use the bare Cargo.toml version.
          if [[ "$ref" == v* ]]; then arc_ver="v$cv"; else arc_ver="$cv"; fi
          pkgname="$name-$arc_ver-${{ matrix.target }}"
          mkdir -p "dist/$pkgname"
          cp "target/release/$name.exe" config.toml.example LICENSE-GPL \
            dist/THIRD_PARTY_LICENSES.html "dist/$pkgname/"
          sed "s/@VERSION@/$arc_ver/" .github/release/README.txt.in > "dist/$pkgname/README.txt"
          cd "dist/$pkgname"
          7z a -tzip "../$pkgname.zip" ./* > /dev/null
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: |
            dist/*.zip
          if-no-files-found: error
          # Two builds a day would otherwise pile up artifacts for the default
          # 90 days. 7 days is enough to grab a build for debugging.
          retention-days: 7

  publish:
    # Only a real release ref (`v*`) publishes. Scheduled runs build `main`,
    # which does not start with `v`, so they never create a release.
    if: startsWith(github.event.inputs.ref || '', 'v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      # Publishing into THIS repo, so the default GITHUB_TOKEN needs write.
      contents: write
      id-token: write
      attestations: write
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - uses: actions/attest@v4
        with:
          subject-path: dist/${{ needs.build.outputs.pkg_name }}-*
      - name: Create the pre-release in THIS repository
        env:
          # Default token can write to the workflow repo itself; no PAT needed.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd dist
          sha256sum ${{ needs.build.outputs.pkg_name }}-* > SHA256SUMS.txt
          # The build ref (e.g. v0.1.0) belongs to the SOURCE repo (vera20k), not
          # this workflow repo, so we do NOT use --verify-tag: gh will create the
          # tag in this repo from its default branch. The release artifacts still
          # come from the vera20k source we checked out.
          gh release create "${{ env.BUILD_REF }}" \
            --prerelease --generate-notes --title "${{ needs.build.outputs.pkg_name }} ${{ env.BUILD_REF }}" ./*
